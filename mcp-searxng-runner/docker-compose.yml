services:
  searxng-system:
    image: searxng/searxng:latest
    container_name: searxng
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8099:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
    stop_grace_period: 60s
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-searxng:
    build:
      context: .
      dockerfile: Containerfile
    image: mcp-searxng:latest
    container_name: mcp-searxng
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - SEARXNG_URL=http://searxng:8080
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
    stop_grace_period: 60s
    depends_on:
      searxng-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q timeout /proc/1/cmdline && curl -sf http://searxng:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  searxng-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16