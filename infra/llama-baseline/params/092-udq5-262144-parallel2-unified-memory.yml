# Arm 092 — arm085's exact proven config re-tested against latest upstream
# llama.cpp with CUDA Unified Memory forced on.
#
# Base = arm 085 (no MTP, K=q4_0/V=q4_1, ctx 262144, parallel=2, ~131K/slot;
# proven 20.1 tok/s/slot with no UM, on the old pin 5fff12845 @ 2026-08-21).
#
# Changes vs 085:
#   1. src/llama-cpp submodule updated 5fff12845 -> 1548a240e (2026-09-05
#      upstream tip, 233 commits ahead), rebuilt from scratch (build-cuda1322,
#      -j 12, ccache-launched). Includes e4b9af007 "fix shared memory race in
#      FA on DGX Spark" (2026-08-31) and 0ba6499c3 "Allow concurrent streams
#      per split for multi-GPU" (2026-09-03) among others.
#   2. Run with GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 exported (not a yaml field —
#      set in the shell env before invoking run-with-params.sh, same as the
#      arm091 gate1b/arm085+UM control runs).
#
# All other fields identical to 085 on purpose — isolates "does updated
# llama.cpp change the ~24% UM decode-speed tax measured on the old pin"
# as the only variable. Previous measurement (old pin, same config):
# no-UM 20.1 tok/s/slot vs UM 15.1-15.5 tok/s/slot (mean 15.3).
---
name: 092-udq5-262144-parallel2-unified-memory
description: "Arm085 config (no MTP, K=q4_0/V=q4_1, ctx 262144, parallel=2) on latest upstream llama.cpp (1548a240e) with GGML_CUDA_ENABLE_UNIFIED_MEMORY=1. Non-production test."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
tensor_split: 27,38
n_gpu_layers: 99
ctx: 262144
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q4_0
cache_type_v: q4_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'on'
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 8192
prio_batch: 1
context_shift: 'on'
n_predict: 150
requests: 40
prompt_path: /tmp/bigprompt.txt
timeout: 120
expect: unknown
