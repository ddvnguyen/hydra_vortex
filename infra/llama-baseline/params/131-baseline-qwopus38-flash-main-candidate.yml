---
name: 131-baseline-qwopus38-flash-main-candidate
description: "hydra_vortex baseline pin 131: Qwopus3.8-27B-Flash-MTP-Q5_K_S.gguf as UNTESTED candidate main model at the pin-130 shape (262144/2 no-kv-unified, ts 27,38, q8_0/q5_1 MTP, UM on, cache_ram 24576, parallel 2, Sharp template via extra_server_args). Structural/tokenizer compat verified; generation quality as main model NOT verified. Do NOT set LLAMACPP_PARAMS_FILE to this file without a quality eval first."

model_path: /mnt/WorkDisk/LLM-Models/Qwopus3.8-27B-Flash-MTP-Q5_K_S.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
env:
  GGML_CUDA_ENABLE_UNIFIED_MEMORY: '1'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 262144
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q5_1
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 24576
prio_batch: 1
context_shift: 'on'
extra_server_args: '--parallel-ctx-threshold 100000 --chat-template-file /etc/llama-baseline/templates/qwen3.8-sharp.jinja'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
