# Arm 747.2 — feature test for hydra_vortex#747: dynamic parallel-slot
# admission by combined-ctx threshold (--parallel-ctx-threshold), lowered
# boundary variant.
#
# Base = 747.0-baseline-nokvu-p2-vq51-th100k.yml, with ONE change:
#   extra_server_args: --parallel-ctx-threshold 100000 -> 80000
#
# WHY: 747.0's threshold (100000) was only ever exercised against an
# extreme deep-pair test (88805+68675=157480 combined, ~2x over threshold)
# and small-prompt overlap tests (combined << threshold) — never near the
# boundary itself. This arm tests the gate's defer/admit decision AT a
# lower, more realistic 80K threshold, with prompt depths chosen to
# straddle it on both sides:
#   - a SINGLE ~40K request: 0 + 40000 < 80000 -> must ADMIT (sanity: the
#     gate must not defer a request that's nowhere near the limit)
#   - a 2nd concurrent ~45K request while the first is resident: depends on
#     how much of the first request's ctx is still resident when the 2nd
#     arrives (this is the actual boundary case to observe — expect ADMIT
#     if timing means the 1st has partially drained, DEFER if resident sum
#     truly crosses 80000)
#   - a candidate at/just past 80K alone (e.g. ~82K): 0 + 82000 >= 80000 ->
#     must DEFER even with the pool otherwise empty (pure single-candidate
#     boundary check, isolates the ">=" comparison itself from any
#     resident-sum interaction)
#
# NOTE: this is deliberately NOT a "force both to run concurrently" test
# (that's 747.0-conc2x80k-th200k, a separate diagnostic with threshold
# raised, not lowered). 747.2 is the opposite: verify the gate correctly
# DEFERS near a realistic, lower boundary — a correctness/boundary test of
# --parallel-ctx-threshold itself, not a throughput measurement.
#
# CHANGES vs 747.0: extra_server_args threshold 100000 -> 80000, nothing
# else (kv_unified off, ctx 296000 = 2x148000 fences, parallel 2, tensor
# split 27,38, K q8_0/V q5_1 MTP, UM env, cache_ram 16384 all unchanged).
---
name: 747.2-baseline-nokvu-p2-vq51-th80k
description: "hydra_vortex#747 arm 747.2: same as 747.0 (clean v0.4.0 5266f24da + admission gate port + UM prefetch net, kv_unified off, parallel=2, ctx=296000=2x148000 fences, V q5_1 main+draft, UM on) but --parallel-ctx-threshold lowered 100000->80000, to test the gate's admit/defer boundary decision at a realistic lower threshold rather than only the extreme 157K-combined and small-prompt cases 747.0 already covered."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
env:
  GGML_CUDA_ENABLE_UNIFIED_MEMORY: '1'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 296000
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q5_1
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 16384
prio_batch: 1
context_shift: 'on'
extra_server_args: '--parallel-ctx-threshold 80000'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
