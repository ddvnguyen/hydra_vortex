# Arm 121 — arm120 shape re-split to 2 slots x 131072 (128K/slot) instead of
# 3 x 32768, PLUS draft-cache raised to bf16 (from q8_0/q4_1) to test whether
# quantized draft K/V is suppressing MTP acceptance rate.
#
# WHY (ctx shape): user-directed — deliberately re-tests the paging-cliff
# question at 2 concurrent slots instead of 3. NOTE: 131072x2 = 262144 total
# cells is ~2x arm120's no-paging ceiling (see 740-results-report.md "Live
# finding 2026-09-07" + arm120's own header math: CUDA0 has ~2264 MiB of free
# budget after model/RS/compute at 98304 cells exhausts it almost exactly —
# so ~128K TOTAL cells is roughly where paging starts, not per-slot). This
# shape is expected to require UM and likely reproduce the same host-RAM
# paging collapse arm119/111 showed, just with 2 slots instead of 3 — that
# comparison (does slot count alone change the paging behavior at a given
# total depth?) is presumably the point of this run.
#
# WHY (draft bf16): spec_draft_type_k/v were q8_0/q4_1 in arm119/120 — per
# user, there is documentation suggesting quantized draft K/V (esp. K)
# measurably reduces MTP draft acceptance rate vs higher precision. bf16
# removes that as a confound. Cost: bf16 draft KV is ~2-4x the bytes/token of
# q8_0/q4_1, adding further VRAM pressure on top of the ctx increase above —
# this shape will need UM and will be VRAM-constrained on both counts
# simultaneously. Compare acceptance rate (draft_n_accepted/draft_n in the
# response `timings` object) against arm119/120's q8_0/q4_1 baseline to
# isolate the effect.
#
# Base: params/120-udq5-32768x3-nokvu-cram24-um.yml (kv_unified off, cram24,
# split 27,38 unchanged, main K=q8_0/V=q5_1 unchanged, MTP kept).
#
# Requires GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 exported in the shell for the
# bare-metal run-with-params.sh path (same as 102/110/111/119/120's UM class)
# — set for BOTH child processes since the RPC-side KV buffer allocation
# happens in the separate rpc-server process, not llama-server itself.
---
name: 121-udq5-131072x2-nokvu-cram24-um-draftbf16
description: "arm120 shape re-split to 2x131072 (262144 total cells) + draft K/V raised to bf16 (from q8_0/q4_1) to remove draft-cache quantization as a confound on MTP acceptance rate. Expected to need UM/paging at this depth (~2x arm120's no-paging ceiling)."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
tensor_split: 27,38
n_gpu_layers: 99
ctx: 262144
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 24576
spec_type: draft-mtp
spec_draft_type_k: bf16
spec_draft_type_v: bf16
prio_batch: 1
context_shift: 'on'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
