# Arm 096 — R001.3: drop to parallel=2 at 132K×2, check UM need and capping
#
# Follow-up to arm094 (R001.1) 132K×3. User asks to drop max concurrency to 2,
# keep per-slot 132000: parallel=2, total --ctx-size = 264000 (2×132000).
# Same production-faithful profile as 093/094: K=q8_0/V=q4_1, MTP on
# (draft-mtp q8_0/q4_1), globals tensor-split 27,38 / ubatch 512 /
# cont-batching / kv-unified / jinja / cache-prompt / cache-reuse 64 /
# prio-batch 1 / context-shift (+ cache_idle_slots on, cache_ram 8192).
#
# 264000 is only ~0.7% above native n_ctx_train=262144 (~1856 tokens), so
# handle carefully:
# - Check whether it triggers "n_ctx_seq (...) > n_ctx_train (...) - capping"
#   as seen in 093/094, or is tolerated without capping.
# - If it does cap, correct non-stale YaRN fix is small scale
#   rope_scale ≈ 264000/262144 ≈ 1.00708, yarn_orig_ctx=262144 — barely any
#   interpolation, unlike 094's 1.511 stretch. Verified against model metadata
#   as for 093/094 (qwen35.context_length=262144, n_ctx_train=262144).
# - Test WITHOUT UM first (Gate 1a style) — this config is much closer to
#   085/092's proven-fit 262144-total baseline than 3-slot 396K cases, so it
#   might fit natively and avoid UM tax entirely. K=q8_0/MTP overhead vs
#   085's K=q4_0/no-MTP is the open question; if it OOMs without UM, fall
#   back to GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 and note.
#
# Gate 1a (no UM) is the point of this arm — don't assume either outcome.
# This file includes the small YaRN scaling (1.0071) so that the 264000
# request is not silently capped to 262144 if the server enforces the cap
# strictly (as it did for 093/094 even with correct YaRN). If Gate 1a shows
# no capping even without YaRN, the scale is harmless (freq_scale 0.993).
#
# Ports 18081/50052, stop production first, restart before finish.
---
name: 096-udq5-132000x2-kq8-mtp
description: "R001.3: 132000×2=264000 total, parallel 2, K=q8_0/V=q4_1 MTP q8_0/q4_1, small YaRN 1.0071/262144 to cover +0.7% over native, test without UM first."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
tensor_split: 27,38
n_gpu_layers: 99
ctx: 264000
rope_scaling: yarn
rope_scale: 1.0071
yarn_orig_ctx: 262144
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q4_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'on'
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 8192
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q4_1
prio_batch: 1
context_shift: 'on'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
