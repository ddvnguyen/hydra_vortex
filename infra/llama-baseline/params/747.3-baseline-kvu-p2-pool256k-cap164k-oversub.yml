# Arm 747.3 — kv_unified_per_slot OVERSUBSCRIPTION edge case: pool sized to
# the model's exact native ctx (262144 = 256K, qwen35.context_length /
# n_ctx_train per arm102's verified model metadata), per-slot cap set high
# enough that cap * parallel > pool.
#
# WHY: verified at source (tools/server/server-context.cpp n_ctx_slot() +
# the boot-time SRV_WRN check) that --kv-unified-per-slot's only validation
# compares the cap against the WHOLE pool (kv_unified_per_slot > n_ctx_seq
# -> warn "cap has no effect"). It NEVER checks cap * n_parallel against
# the pool. Here: parallel=2, kv_unified_per_slot=164000 -> claimed
# aggregate capacity 328000, but the shared pool is only 262144 -- an
# oversubscribed guarantee the code does not detect or warn about.
#
# EXPECTED (untested, this arm's whole purpose is to observe real behavior,
# not confirm a prediction):
#   - Boot should show the normal "capping per-slot context (262144) to
#     --kv-unified-per-slot (164000)" info line, NO warning about the
#     parallel*cap oversubscription (that's the bug/gap being demonstrated).
#   - Single request growing toward 164K alone: should work fine (pool has
#     262144 available, one slot alone never conflicts).
#   - TWO requests BOTH growing toward ~130-164K concurrently: the
#     interesting case. Predict the shared pool exhausts around ~131K each
#     (262144/2) before either reaches its nominal 164K cap. Observe: does
#     context_shift (on, per 747.0's inherited setting) silently evict
#     older KV cells from one/both slots, does an allocation error/OOM
#     surface, or does something else happen? Record the ACTUAL log lines
#     and behavior verbatim -- do not assume the predicted failure mode.
#
# Base: params/747.1-baseline-kvu-p2-vq51-th100k-pool148k.yml, with:
#   ctx: 296000 -> 262144 (exact model n_ctx_train, not an arbitrary round
#     number -- this specific value matters for the test)
#   kv_unified_per_slot: 148000 -> 164000 (chosen so 2x164000=328000 clears
#     262144 by a comfortable, unambiguous margin -- not a near-miss)
#   Everything else unchanged: parallel 2, kv_unified on, tensor_split
#   27,38, K q8_0/V q5_1 MTP, UM env, cache_ram 16384, threshold 100000.
---
name: 747.3-baseline-kvu-p2-pool256k-cap164k-oversub
description: "hydra_vortex#747 arm 747.3: kv_unified_per_slot OVERSUBSCRIPTION edge case. Pool sized to the model's exact native ctx (262144=256K), kv_unified_per_slot=164000, parallel=2 -> claimed aggregate capacity (328000) exceeds the actual shared pool (262144) by 65856 tokens. The boot-time validation in server-context.cpp only checks cap vs whole-pool (164000<262144, passes silently) and never checks cap*n_parallel vs pool -- this arm observes what actually happens when both slots grow concurrently toward their nominal cap and the shared pool runs out first: context_shift eviction, allocation failure, or something else undocumented."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
env:
  GGML_CUDA_ENABLE_UNIFIED_MEMORY: '1'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 262144
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'on'
kv_unified_per_slot: 164000
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q5_1
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 16384
prio_batch: 1
context_shift: 'on'
extra_server_args: '--parallel-ctx-threshold 100000'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
