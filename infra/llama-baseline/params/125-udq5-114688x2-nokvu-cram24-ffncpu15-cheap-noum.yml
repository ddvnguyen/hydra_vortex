---
name: 125-udq5-114688x2-nokvu-cram24-ffncpu15-cheap-noum
description: "2x114688 slots (229376 cells, +16.7% vs arm124) via REALLOCATED FFN offload to the cheapest contiguous runs: 13 CUDA0 blocks 43-55 (2425.80 MiB — excluding the model's most-expensive 54-63 tail arm124 used) + 2 RPC0 blocks 14-15 (273.59, required — RPC0 alone is -75 MiB over at this ctx). 15 blocks, 2699.39 MiB CPU/step (+61%), NO UM. Holds up to ~201K combined filled (n=2 near-deep) without paging; expected combined ~13-17 tok/s at 157.5K fill, ~11-15 at ~201K (vs UM-family 0.9-2.7). Prefill ~12-25 min/prompt one-time."

