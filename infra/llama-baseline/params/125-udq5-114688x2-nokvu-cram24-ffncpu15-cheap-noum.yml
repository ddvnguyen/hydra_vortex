# TEST PLAN (handoff; boot-rig agent executes, 740-reporters record):
#   Test prompts 2026-09-08 state:
#     /tmp/bigprompt_90k_a.txt  88805 tok   (slot A)
#     /tmp/bigprompt_90k_b.txt  68675 tok   (alternates/sanity)
