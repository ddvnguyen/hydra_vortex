# Arm 129c — third point in the arm129 thread-count family: IDENTICAL N=10
# window (CUDA0 blocks 30-39, 1,786.97 MiB freed, T=196608), UM net ON,
# everything unchanged EXCEPT threads explicitly set to 16 (no --cpu-range
# affinity pin).
#
# ======================================================================
# USER DIRECTION (2026-09-08): "Using 16 threads" — after arm129 (6-core
# PINNED, decode ~12 tok/s combined) and arm129b (8 threads AUTO/unpinned,
# decode recovered to 15.85 tok/s combined, still below the family's
# interpolated 17.0-19.6 band), test a further thread-count increase.
# ======================================================================
#
# CONTEXT FROM VERIFICATION (independently confirmed this session): arm124,
# arm126, arm127, arm128 ("uncapped" family baseline, no explicit --threads)
# ALL ran at n_threads=8 (auto-detected on this 20-core host — verified via
# system_info line in arm127's llama-server.log). So arm129b's 8-thread run
# is directly comparable to the family's existing uncapped baseline, and its
# shortfall vs. the N=10 interpolated band (17.0-19.6, between arm124's N=8
# @20.58 and arm127's N=12 @16.01) is NOT a threading artifact of comparing
# different thread counts -- it's a real, unexplained gap. 16 threads is
# genuinely NEW territory, not a re-test of the existing family baseline.
#
# WHAT STAYS IDENTICAL TO ARM129/129B (byte-identical on every other field):
# override_tensors (blk\.3[0-9]\., 30-39 window), ctx 196608 (2x98304),
# kv_unified off, UM env ON, KV quants, MTP/draft config, cache_prompt/
# cache_idle_slots/cram24, tensor split 27/38. Only extra_server_args changes.
#
# EXPECTED VRAM MATH — UNCHANGED from arm129/129b (thread count does not
# touch any buffer size; compute/KV/model buffers are independent of
# --threads): CUDA0 model 9314.04 MiB, main KV 3132.40, draft KV 324.30,
# RS 673.31, compute 1144.01 -> used 14588.06, gap band 1448.4-1505.6 ->
# FREE BAND ~217-275 MiB. RPC0 unchanged ~771 free. Gate thresholds
# UNCHANGED: phase-a PASS >=250 / HARD STOP <150 (gray 150-219 = capture +
# report, no unilateral deep-fill); phase-c PASS >=140 / HARD STOP <100.
#
# WHAT THIS ARM TESTS: does raising threads from 8 (auto, arm129b) to 16
# (explicit, no pin) close more of the gap to the 17.0-19.6 band? If yes,
# decode remains thread/dispatch-bound well past 8 threads and the family's
# "uncapped" baseline was itself leaving performance on the table. If
# decode is flat or barely moves vs. arm129b, 8 threads was already at or
# near the useful ceiling for this workload and the residual N=10 gap is
# explained by something else (window selection, cache/dispatch overhead
# unrelated to raw thread count).
#
# ALSO RECORD: prefill wall time for slot A should be similar to arm129b's
# (221.5s-class) or faster -- more threads should not regress prefill,
# which was already shown DDR-bandwidth-bound / thread-count-insensitive
# across arm129 (6) vs arm129b (8).
#
# CAUTION -- HOST COURTESY: 16 of 20 cores is 80% of the host during
# CPU-offload decode, more aggressive than arm129b's auto-8. This is an
# explicit, deliberate, ONE-TIME measurement per direct user instruction --
# not a policy change. Boot-test agent: keep this boot SHORT (standard
# single + n=2 test plan only, no extended exploration) and tear down
# promptly after gate 4 to minimize shared-host impact.
#
# GATE CHECKLIST (same as arm129/129b, 4-phase protocol):
#   1. Boot log buffers (verbosity >= 4): CUDA0 model ~9314, RPC0 ~7062.06
#      unchanged, KV ~3132.4 main + ~324.3 draft, RS 673.31+523.69, compute
#      CUDA0 1144.01 / RPC0 1088.28 / CPU 132.28. system_info line: confirm
#      n_threads = 16 (n_threads_batch = 16) exactly -- not 8, not 20.
#   2. n_ctx_slot = 98304, kv_unified = false; ready; UM env = 1; no OOM.
#   3. PHASE MARGINS (PRIMARY go/no-go, same thresholds as arm129/129b):
#      a. ready+self-test: CUDA0 free >= 250 PASS / <150 HARD STOP /
#         150-219 gray -> capture + report, no unilateral deep-fill.
#      b. post-warmup: within ~100 of phase-a.
#      c. full 157.5K fill: CUDA0 free >= 140 PASS / <100 HARD STOP.
#   4. Decode telemetry: dmon across decode; PCIe < ~3 GB/s. NOTE: arm129
#      and arm129b both showed one unexplained single-sample PCIe tx spike
#      (15.3 and 12.7 GB/s respectively) at concurrent-test start, same
#      trigger (simultaneous dual-slot cached-checkpoint restore), non-
#      sustained, no margin drift. If arm129c sees the same signature,
#      report fully (full dmon trace, not just peak), check margin
#      stability before/after -- do not treat a bare repeat as automatic
#      failure OR automatic pass.
#
# TEST PLAN (handoff to muse-spark after design review; design-only from
#   here): same prompts and structure as arm129/129b for direct
#   comparability -- /tmp/bigprompt_90k_a.txt (88805 tok),
#   /tmp/bigprompt_90k_b.txt (68675 tok).
#   0. Boot; gates 1-2; phase-a margins; short-request spec stats; CONFIRM
#      system_info shows n_threads = 16 exactly.
#   1. PRIME slot A (bigprompt_90k_a, max_tokens ~256, curl timeout
#      >=3600s). Record prefill wall time + tg via print_timing (FINAL
#      settled rate from the eval-time line, not an intermediate n_gen
#      checkpoint).
#   2. PRIME slot B (bigprompt_90k_b, same).
#   3. n=2 CONCURRENT (max_tokens 256-512 each): per-slot tg (final
#      eval-time rate) + combined, acceptance per slot, margins post-run,
#      dmon trace, KV-shift events. Report BOTH the final-rate sum and the
#      total-gen-tokens/wall-clock aggregate (arm128/129/129b's dual
#      convention) for direct comparability.
#   4. Rank against arm129 (6 pinned), arm129b (8 auto), and arm124/126/127
#      (different N, uncapped @8) on the family frontier. Append 4-phase
#      margins, buffer lines, tok/s (both methods), acceptance, prefill
#      wall times, PCIe trace to docs/investigations/740-results-report.md
#      as the arm129/129b/129c three-way thread comparison.
#
# Base: params/129b-udq5-98304x2-nokvu-cram24-ffncpu10-cheap-nocap-umnet.yml,
#   with: extra_server_args threads set explicitly to 16, everything else
#   byte-identical.
---
name: 129c-udq5-98304x2-nokvu-cram24-ffncpu10-cheap-t16-umnet
description: "Third point in the arm129 thread-count family: IDENTICAL N=10 window (CUDA0 blocks 30-39, 1,786.97 MiB freed, T=196608, UM net ON) with threads explicitly set to 16 (no --cpu-range pin). arm129 (6 pinned) measured ~12 tok/s combined decode; arm129b (8 auto, matching the family's existing uncapped baseline) recovered to 15.85 tok/s, still below the family's 17.0-19.6 N=10 interpolated band. Tests whether decode remains thread/dispatch-bound past 8 threads."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors:
  - 'blk\.3[0-9]\.ffn_(gate|up|down)\.weight=CPU'
extra_server_args: '-lv 4 --threads 16 --threads-batch 16'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 196608
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 24576
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q4_1
prio_batch: 1
context_shift: 'on'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
