# Arm 113 — arm102's exact shape/yaml, rebooted repeatedly (>=4x) with GPU
# clocks/P-state FORCED and full clock telemetry captured across every boot.
# Suggested arm #2 (2026-09-06), from cross-agent research (792db69b),
# targeting the still-unsolved bimodal boot-mode variance first surfaced in
# arm100 (same config landing in one of two ~2x-apart throughput regimes,
# cause not yet identified — see 703-results-report.md).
#
# NOTE: this overlaps with a boot-mode root-cause task already dispatched
# to another agent (telemetry capture via
# nvidia-smi --query-gpu=clocks.sm,clocks.mem,power.draw,pstate,temperature.gpu
# through boot+tier). Check that agent's findings before running this arm —
# do not duplicate a live investigation. The one NEW thing this arm adds on
# top of passive telemetry: actively forcing clocks/persistence mode BEFORE
# boot, to see if locking P-state kills the bimodal split outright:
#
#   nvidia-smi -pm 1                      # persistence mode on, both GPUs
#   nvidia-smi -ac <mem_clock>,<sm_clock> # lock application clocks
#     (query supported pairs first: nvidia-smi -q -d SUPPORTED_CLOCKS)
#
# Procedure: for each of >=4 fresh boots of the identical 102 yaml, run the
# forcing commands above immediately before starting run-with-params.sh,
# capture the query-gpu telemetry line above once per second through boot
# and through the single-request tier, then compare throughput class
# (fast ~46 tok/s vs slow ~22-27 tok/s) against the captured clock/pstate
# trace. If forcing clocks collapses the bimodal split to one mode, that's
# the root cause; if it doesn't, rule out clock/P-state and move to the
# next hypothesis (RPC connection order, MTP warm-up state).
#
# Yaml is byte-identical to 102-udq5-146176x3-nokvu-cram24-um.yml — the
# only variable under test is the boot procedure, not any server flag.
