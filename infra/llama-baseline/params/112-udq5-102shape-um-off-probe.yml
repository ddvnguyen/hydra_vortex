# Arm 112 — arm102's exact shape, booted WITHOUT
# GGML_CUDA_ENABLE_UNIFIED_MEMORY exported at all. Suggested arm #1
# (2026-09-06), from cross-agent research (792db69b): arm102's own VRAM
# math sums to ~14.4 GiB (trunk KV ~7.3 GiB + weights ~6.3 GiB + MTP
# ~0.85 GiB) against the 5060 Ti's 16 GiB — under budget without any UM
# host-spill headroom. If true, arm102 doesn't need cudaMallocManaged
# paging at all, and we can drop the UM allocator tax entirely (measured
# elsewhere in this ledger at ~20-24%) for our best config, for free.
#
# THIS IS THE ONLY DIFFERENCE FROM 102: do not export
# GGML_CUDA_ENABLE_UNIFIED_MEMORY in the shell before running
# run-with-params.sh against this file. Every yaml field is identical to
# 102-udq5-146176x3-nokvu-cram24-um.yml.
#
# Two outcomes, both informative:
#   - Boots clean, same throughput as 102: UM was dead weight for this
#     shape — promote 112 over 102 as the concurrency-pin candidate.
#   - OOMs at boot: the CUDA1 (3060, 12 GiB) side of the split is the
#     actual constraint (tensor_split 27,38 puts more weight/compute on
#     CUDA0/5060Ti but CUDA1 still holds a meaningful KV+weight share) —
#     valuable negative result, answers the question either way.
#
# Same bimodal-boot-mode caveat as the rest of this ledger — if it boots,
# run >=2 fresh boots before trusting a throughput match/mismatch vs 102.
