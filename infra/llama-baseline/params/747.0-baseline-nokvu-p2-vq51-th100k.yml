# Arm 747 — feature test for hydra_vortex#747: dynamic parallel-slot
# admission by combined-ctx threshold (--parallel-ctx-threshold).
#
# Base = arm090-equivalent (NO CPU-FFN-offload override_tensors, MTP kept,
# kv_unified=on, ctx=148000, cache-ram 16 GiB, K q8_0 / V q4_1, yarn 5x,
# tensor_split 27,38, RPC on CUDA1 + server on CUDA0, ports 18081/50052).
# CHANGES vs arm090 (090-udq5-148000-parallel1-cache-ram-16g.yml):
#   parallel: 1 → 2 (real 2nd slot; kv_unified keeps the pool at 148K total
#   and lets a single sequence use the whole pool — arm090 single-request
#   parity is preserved by construction)
#   extra_server_args: --parallel-ctx-threshold 100000 (the #747 gate: a
#   queued request is only admitted when resident-ctx-sum + candidate-prompt
#   < 100K; otherwise it stays in the cont_batching defer queue until an
#   active slot releases)
#   env: GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 (safety net per #740 pattern)
#
# EXPECTED BEHAVIOR:
#   1. Single request (any size ≤ pool): arm090-parity tg (~37-40 tok/s) —
#      the gate must not regress the common case.
#   2. n=2 concurrent small (combined ≪ 100K): both slots decode the same
#      batch step (genuine parallel).
#   3. n=2 concurrent deep (combined ≥ 100K, e.g. 88805 + 68675 = 157480):
#      the 2nd request DEFERS at admission ("parallel-ctx-threshold: defer
#      task ..." in the log) and only launches when the 1st releases.
#   4. 4-phase VRAM margins (boot/warm/fill/decode) + dmon PCIe < ~3 GB/s.
#
# Budget logic: threshold (100K) < pool (148K) guarantees the combined
# resident ctx can never exceed the static kv_unified pool — admission
# control replaces dual-residency sizing. UM is the catch for transient
# overshoot after admission (in-flight growth is not gated, by design).
---
name: 747.0-baseline-nokvu-p2-vq51-th100k
description: "hydra_vortex#747 BASELINE arm (user-directed config): clean v0.4.0 (5266f24da) + admission gate port + UM prefetch net. kv_unified OFF (per-slot fences, arm102 approach), parallel=2, per-slot ctx 148000, V q5_1 main+draft, UM on, threshold 100000."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
env:
  GGML_CUDA_ENABLE_UNIFIED_MEMORY: '1'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 296000
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
spec_type: draft-mtp
spec_draft_type_k: q8_0
spec_draft_type_v: q5_1
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 16384
prio_batch: 1
context_shift: 'on'
extra_server_args: '--parallel-ctx-threshold 100000'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
