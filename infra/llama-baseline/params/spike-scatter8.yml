# SPIKE-scatter8 (research spike, NOT an arm) - adjacency A/B leg (b): SCATTERED
# 8 ISOLATED blocks (no two adjacent), blocks 30,32,34,38,40,45,47,49, spread
# across CUDA0's 28-63 range.
#
# BYTE MATCHING vs leg (a) spike-contig8 (exact, from the arm125-header GGUF
# parse): 175.31 x7 (30,32,34,38,45,47,49) + 197.89 (40) = 1425.06 MiB =
# contig 43-50's 186.60 + 175.31 x6 + 186.60. Identical CPU bytes/step,
# identical freed VRAM => any difference vs leg (a) is position/adjacency.
#
# Every offloaded block here is surrounded by GPU blocks (isolated CPU island
# in the graph); leg (a)'s 8 consecutive blocks are separated only by their
# own attention. Source model (ggml-backend.cpp pass 1-2) predicts NO
# structural difference: CPU islands are per-FFN-sublayer in both legs,
# tg splits = 2N+3 = 19 for both. This boot tests that prediction plus
# free-margin and short-decode speed at byte-identical mass.
#
# All other params identical to spike-contig8 (ctx 98304 = 2 x 49152 - the
# first contig attempt at arm124's 196608 OOMed: an 8-block window must free
# >= 1512.23 MiB there; see spike-contig8.yml header). NO UM.
---
name: spike-scatter8
description: "A/B leg (b): scattered isolated 8-block FFN offload 30,32,34,38,40,45,47,49 (1425.06 MiB, byte-identical to contig leg), ctx 98304 (2x49152), no UM."

