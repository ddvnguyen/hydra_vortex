server_cuda_device: '0'
override_tensors:
  - 'blk\.(30|32|34|38|40|45|47|49)\.ffn_(gate|up|down)\.weight=CPU'
tensor_split: 27,38
n_gpu_layers: 99
ctx: 98304
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
