# Arm 122 — arm121 + explicit YaRN RoPE scaling (rope_scaling=yarn,
# rope_scale=5, yarn_orig_ctx=32768), which arm121 (and the whole
# 102/110/111/119/120/121 UM-family) never set at all.
#
# WHY: arm090 (the production pin) explicitly sets rope_scaling: yarn,
# rope_scale: 5, yarn_orig_ctx: 32768 -- extending the model's native
# trained context (32768) 5x to 163840 via YaRN. None of the UM-family
# arms (102/110/111/119/120/121) set this. If the model's native context
# really is 32768 and no scaling is applied, every depth test we ran past
# ~32K tokens on those arms may have been running the model outside its
# properly-extended context window -- a potential coherence/quality issue
# independent of (and possibly compounding) the paging-speed collapse
# already documented in 740-results-report.md. This arm isolates that
# variable: same shape as arm121 (2x131072, draft bf16, UM-backed,
# 262144 total cells), YaRN added, nothing else changed.
#
# TEST PLAN (user-directed):
#   1. Single request at ~88.8K depth (same prompt as arm121's test, for
#      direct comparison) -- check decode tok/s AND draft acceptance rate
#      against arm121's un-scaled result (1.27 tok/s, 129/354=36.4% accepted
#      at 88.8K depth).
#   2. n=2 concurrent (same two prompts as arm121's test: ~88.8K + ~68.7K)
#      -- check whether YaRN changes the paging-collapse behavior itself
#      (shouldn't, since RoPE scaling doesn't change KV byte size) or only
#      the coherence/acceptance-rate side of the picture.
#
# Base: params/121-udq5-131072x2-nokvu-cram24-um-draftbf16.yml (unchanged:
# kv_unified off, cram24, split 27,38, main K=q8_0/V=q5_1, MTP kept,
# draft K/V bf16, 2 slots x 131072).
#
# Requires GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 exported in the shell for the
# bare-metal run-with-params.sh path (same as 102/110/111/119/120/121's UM
# class) -- set for BOTH child processes since the RPC-side KV buffer
# allocation happens in the separate rpc-server process, not llama-server
# itself.
---
name: 122-udq5-131072x2-nokvu-cram24-um-draftbf16-yarn
description: "arm121 (2x131072, draft bf16, UM-backed) + explicit YaRN RoPE scaling (yarn/scale=5/orig_ctx=32768), which arm121 and the whole UM-family never set. Isolates whether missing YaRN was degrading long-context coherence/acceptance independent of the paging-speed collapse."

model_path: /mnt/SSD/Qwen3.8-27B-UD-Q5_K_M.gguf
cuda_home: /opt/software/cuda/13.2.2
rpc_port: 50052
rpc_cuda_device: '1'
rpc_endpoint: 127.0.0.1
server_port: 18081
server_cuda_device: '0'
override_tensors: []
tensor_split: 27,38
n_gpu_layers: 99
ctx: 262144
rope_scaling: yarn
rope_scale: 5
yarn_orig_ctx: 32768
flash_attn: 'on'
cache_type_k: q8_0
cache_type_v: q5_1
ubatch: 512
jinja: 'on'
parallel: 2
cont_batching: 'on'
kv_unified: 'off'
cache_reuse: 64
cache_prompt: 'on'
cache_idle_slots: 'on'
cache_ram_mib: 24576
spec_type: draft-mtp
spec_draft_type_k: bf16
spec_draft_type_v: bf16
prio_batch: 1
context_shift: 'on'
n_predict: 150
requests: 10
prompt_path: /tmp/bigprompt.txt
timeout: 300
expect: unknown
