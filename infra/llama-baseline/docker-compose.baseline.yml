name: llama-baseline

# Bare-bone upstream llama.cpp on 2xRTX (5060 Ti + 3060) — no Hydra.
# Single pooled llama-server across both GPUs (vanilla upstream pooling).
# Model: Qwopus3.6-27B-Coder-Compat-MTP-Q5_K_M 19.5GB — does not fit solo, needs split.
# Ctx: stable 32K on this hardware (96K→2040MiB OOM, 64K→1360MiB OOM on 3060 12GB even with 65/[25,40]/layer).
# Verified stable: 32K with 45 layers + 40,25 split (8.3GB/5.6GB model, ~1GB KV). Test: curl localhost:18080/health
# Build: host cmake -S src/llama-cpp -B src/llama-cpp/build -DGGML_CUDA=1 -DLLAMA_CURL=ON && cmake --build src/llama-cpp/build --parallel 8
# Run: podman compose -f infra/llama-baseline/docker-compose.baseline.yml up -d --build
#      podman logs -f llama-baseline_llama_1  # watch "model loaded" / OOM
# Alt: docker-compose.baseline-64k.yml (64K OOM doc) / docker-compose.baseline-96k.yml (96K OOM doc)
# Harness: OPENAI_BASE_URL=http://localhost:18080/v1 OPENAI_API_KEY=dummy dsh/pi
# Note: 18080 avoids collision with infra-openwebui on host :8080 (host network). Use :8080 only if openwebui stopped.

services:
  llama:
    build:
      context: ../..
      dockerfile: infra/llama-baseline/Dockerfile.baseline
    image: localhost/llama-baseline:upstream
    network_mode: host
    devices:
      - nvidia.com/gpu=all
    volumes:
      # Host model stores — keep both mounts to match compose.hydra pattern
      - /mnt/SSD:/models:ro
      - /mnt/WorkDisk/LLM-Models:/models2:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1
      - CUDA_VISIBLE_DEVICES=0,1
      - LD_LIBRARY_PATH=/usr/local/cuda-13.2/targets/x86_64-linux/lib:/usr/local/lib
    command: >
      --model /models/Qwopus3.6-27B-Coder-Compat-MTP-Q5_K_M.gguf
      --host 0.0.0.0 --port 18080
      --n-gpu-layers all --split-mode layer
      --tensor-split 40,25
      --override-tensor token_embd.weight=CPU
      --ctx-size 98304 --rope-scaling yarn --rope-scale 3 --yarn-orig-ctx 32768
      --cache-type-k q8_0 --cache-type-v q4_0 --flash-attn on
      --parallel 2 --cont-batching
      --jinja --chat-template-file /models/qwen3.6_merged_template.jinja
      --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.75
      --metrics --slots --log-verbosity 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      component: llama-baseline
