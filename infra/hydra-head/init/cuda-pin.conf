# Pin CUDA runtime to the exact 13.2.2 release (owner requirement).
# The engine binary (llama-engine) is built against CUDA 13.2.2; the image
# must ship the MATCHING runtime. The -13-2 series metapackages
# (cuda-runtime-13-2 / cuda-libraries-13-2 / cublas13) float their
# transitive deps to the newest micro (libcublas.so.13.4.1.3 etc.), which
# BREAKS the engine's baked fattn kernels (launch_fattn CUDA error). These
# preferences hold every runtime component on the 13.2.2 release line.
Package: cuda-runtime-13-2 cuda-libraries-13-2 cuda-cudart-13-2 cuda-cudart13
Pin: version 13.2.2*
Pin-Priority: 1001

Package: cublas13 cublas-cuda-13 libcublas13-dev-cuda-13 libcublas13
Pin: version 13.2.2*
Pin-Priority: 1001

Package: libcublas-13-2
Pin: version 13.2.2*
Pin-Priority: 1001
