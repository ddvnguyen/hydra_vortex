# Pin CUDA runtime to the EXACT micros of the CUDA 13.2.2 toolkit.
# The engine (llama-engine) is compiled in CI with the CUDA 13.2.2 toolkit
# at /opt/software/cuda/13.2.2 (nvcc V13.2.86, cudart 13.2.86) — the
# correct toolkit path. The image MUST ship the same micros: the -13-2
# series metapackages float to 13.3-era backports (cublas 13.4.1.3) which
# break the baked fattn kernels ("CUDA error: unspecified launch failure"
# at ggml-cuda.cu:103 / fattn-common.cuh:1109).
Package: cuda-cudart-13-2
Pin: version 13.2.86-1
Pin-Priority: 1001

Package: cuda-cudart13
Pin: version 13.2.86-1
Pin-Priority: 1001

Package: cublas-cuda-13
Pin: version 13.2.2.2-1
Pin-Priority: 1001

Package: cublas13
Pin: version 13.2.2-1
Pin-Priority: 1001

Package: libcublas13-cuda-13
Pin: version 13.2.2.2-1
Pin-Priority: 1001

Package: libcublas13-dev-cuda-13
Pin: version 13.2.2.2-1
Pin-Priority: 1001

# The release metapackages resolve to the pinned micros above.
Package: cuda-runtime-13-2 cuda-libraries-13-2 cuda-cudart
Pin: version 13.2.2-1
Pin-Priority: 1001
