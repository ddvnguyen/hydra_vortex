; ── RTX 3060 (sm_86, host, 12 GB) — preset for inline PREFILL model reload ──
; GGUF-FILE aliases (not Hydra routing identities). The 3060 has 12 GB VRAM,
; so every quant here uses aggressive CPU offload (partial n-gpu-layers +
; embedding/output on CPU) — it cannot fit any of these fully on GPU. Lists
; every GGUF this worker can host so Core can swap/confirm against it. Core
; translates the routing identity (moe-35b-solo, moe-35b-pd, ...) via
; models.json's model_file_aliases dict and sends the resolved GGUF-file
; alias on PREFILL.
; (The 27B-coder COMBINED layer-split profile is only valid with the 5060 Ti
; as head peer, so it is intentionally omitted here — standalone 3060 only.)

[qwen3.6-35B-mini]
model    = /models/Qwopus3.6-35B-A3B-v1-APEX-I-Mini.gguf
n-gpu-layers = 99
n-cpu-moe = 8
override-tensor = token_embd\.weight=CPU,output\.weight=CPU,output_norm\.weight=CPU
alias    = qwen3.6-35B-mini

; Balanced Q5_K is larger than Mini Q3_K, so fewer layers stay on GPU.
[qwen3.6-35B-balanced]
model    = /models/Qwopus3.6-35B-A3B-v1-APEX-I-Balanced.gguf
n-gpu-layers = 40
n-cpu-moe = 8
override-tensor = token_embd\.weight=CPU,output\.weight=CPU,output_norm\.weight=CPU
alias    = qwen3.6-35B-balanced

; 27B Dense coder — SOLO CPU-offload tuning for the 3060 (12 GB can't fit
; it on GPU, so partial n-gpu-layers + embedding on CPU).
[qwen3.6-27B-coder]
model    = /models/Qwopus3.6-27B-Coder-Compat-MTP-Q5_K_M.gguf
n-gpu-layers = 20
override-tensor = token_embd.weight=CPU
alias    = qwen3.6-27B-coder
