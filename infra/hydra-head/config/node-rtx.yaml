# Hydra Head - RTX Node Configuration (model-agnostic)
# RTX 5060 Ti on host machine
# All model-specific config lives in models.json; this file is pure process/infra.
# The `model:` below is the BOOT resident only (what llama-engine loads at
# startup before the first PREFILL). Per-request model selection is driven
# by the `model_file_aliases` in models.json via inline PREFILL reload
# (see preset-rtx5060ti.ini for the alias -> file path map the engine
# uses to swap). To change the boot resident, edit this line; per-request
# swapping is automatic.

node:
  name: rtx
  mode: container

binaries:
  llama-server:
    # Fat binary: sm_86 (RTX 3060) + sm_120a (RTX 5060 Ti) in one SASS
    # image. The RTX 5060 Ti picks sm_120a; the RTX 3060 picks sm_86.
    # Same OCI image used by node-rtx3060.yaml, built + pushed by
    # hydra-build.yml (ddvnguyen/llama.cpp). Tag is
    # <arch>-<binary>-<fork-version>-<short-sha>, plus a floating
    # -latest; this file defaults to -latest and gets pinned to a
    # specific tag by the deploy-llama job's llama-tag-suffix input
    # (.github/workflows/ci.yml, workflow_dispatch).
    #
    # This is the default OCI-pull path. The old local-build
    # bind-mount (src/llama-cpp/build_sm86_sm120/bin/ shadowing this
    # pull) is now opt-in via docker-compose.hydra.local-build.yml —
    # see that file if you need the fast local-iteration path back.
    #
    # `binary`/`dest` MUST match `llama.binary` below (llama-engine,
    # not llama-server — see that comment for why). The map key stays
    # `llama-server` (matches the OCI image/repo name), but the actual
    # on-disk filename it pulls-or-skips is llama-engine. This name
    # mismatch was the root cause of the RTX heads crash-looping on
    # 2026-07-18 (issue #453/#460): the skip-check in main.go looks
    # for `dest` on disk before pulling — with the wrong filename it
    # never found the already-built binary, fell through to a real
    # OCI pull, and that pull fatally failed against this directory's
    # intentional :ro mount when the bind-mount override is in use
    # (do not "fix" a mismatch like this by making the mount :rw).
    source: ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-6d00536
    binary: llama-engine
    dest: /llama/bin/llama-engine
  node_exporter:
    source: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    binary: node_exporter
    dest: /opt/hydra/bin/node_exporter
  nvidia_gpu_exporter:
    source: https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v1.2.1/nvidia_gpu_exporter_1.2.1_linux_x86_64.tar.gz
    binary: nvidia_gpu_exporter
    dest: /opt/hydra/bin/nvidia_gpu_exporter

llama:
  # Use llama-engine (not llama-server) for the head — the COMBINED
  # engine mode is implemented in the llama-engine binary only (fork
  # ddvnguyen/llama.cpp hydra-state-streaming branch). llama-engine
  # accepts the same args as llama-server PLUS the hydra flags
  # (--rpc-engine, --combined-ot-pattern) that the filter function
  # strips out of argv before common arg parsing (the llama-server
  # binary doesn't have this filter, so it rejects the flags as
  # "invalid argument"). llama-engine is a drop-in replacement for
  # SOLO mode too — same /v1/chat/completions, /slots, /health,
  # /metrics endpoints.
  binary: /llama/bin/llama-engine
  working_dir: /llama
  port: 8080
  rpc_port: 9503
  params:
    # Boot resident: smallest 35B quant. Inline PREFILL reload swaps
    # to the requested alias (qwen3.6-35B-balanced, qwen3.6-27B-coder)
    # per-request based on models.json model_file_aliases.
    model: /models/Qwopus3.6-35B-A3B-v1-APEX-I-Mini.gguf
    models-preset: /opt/hydra/config/preset-rtx5060ti.ini
    chat-template-file: /models/qwen3.6_merged_template.jinja

    # Context and parallelism
    ctx-size: 128000
    parallel: 2

    # Sampling
    temp: 0.86
    repeat-penalty: 1.06
    top-k: 20
    top-p: 0.95

    # Slot management
    slot-prompt-similarity: 0.4

    # ── COMBINED engine-mode wiring (feat/add-rtx-3060-head) ───────────
    # The peer (rtx3060) exposes a single unified RPC port at 9504 (its
    # `rpc_port` in node-rtx3060.yaml — matches Hydra.Core's
    # `llama_rpc_port` for rtx3060 in workers.json). The head reaches
    # into the 3060's backend to dispatch expert tensors via the ggml-RPC
    # fork at f1801f524 + the fail-open fix in
    # ggml_backend_rpc_get_device_count (hydra_vortex#376) so the TCP-up
    # / RPC-down race window no longer aborts. Combined with the
    # 'combined' capability advertisement in engine_info (#375), the C#
    # side now sees a valid plan and drives SET_EXPERT_MODE("combined")
    # on every > 4K request.
    #
    # Post-v4-merge (fork #30/#37): the head no longer needs its own
    # `ggml-rpc-port` (there's no separate ggml-RPC listen port anymore —
    # a single `rpc_port` per process serves both the Hydra protocol and
    # ggml-RPC compute, dispatched by a one-byte MSG_PEEK). `--ggml-rpc-port`
    # is a removed no-op on the current llama-engine binary; dropped here.
    rpc-engine: "localhost:9504"

  env:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    LD_LIBRARY_PATH: /llama/bin:/usr/local/cuda-13.2/lib64
    LLAMA_CHAT_TEMPLATE_KWARGS: '{"preserve_thinking": true}'

services:
  node_exporter:
    enabled: true
    binary: /opt/hydra/bin/node_exporter
    port: 9100
    args:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
  nvidia_exporter:
    enabled: true
    binary: /opt/hydra/bin/nvidia_gpu_exporter
    port: 9835
    args:
      - "--query-field-names=name,driver_version,gpu_uuid,memory.total,memory.used,memory.free,utilization.gpu,utilization.memory,temperature.gpu,power.draw,clocks.sm,clocks.mem"
