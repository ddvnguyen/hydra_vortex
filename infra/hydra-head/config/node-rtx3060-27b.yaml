# Hydra Head - RTX 3060 Node - 27B COMBINED Static Profile (Peer Only)
# Compute-only mode: no `model` param, just exposes GPU 1 as a ggml-RPC
# backend for the 5060 Ti head. Lightweight: only the RPC server thread +
# HTTP health endpoint.
#
# Post-v4-merge (fork #30/#37), there's a single unified port for the
# whole process — `rpc_port` below IS the port the head's `rpc-engine`
# dials (localhost:9504 in node-rtx-27b.yaml), matching Hydra.Core's
# `llama_rpc_port` for rtx3060 in workers-27b.json. The old `--peer-only`
# / `--ggml-rpc-port` flags are removed no-ops on the current llama-engine
# binary (it warns and ignores them) — `peer-only: true` below is kept
# only as a hydra-head-side marker (health-checker simple mode, T4 fit
# preflight skip); hydra-head's config.go filters it out of the actual
# CLI args it passes to the binary.

node:
  name: rtx3060
  mode: container

binaries:
  llama-server:
    source: ghcr.io/ddvnguyen/llama-server:sm86-sm120-engine
    binary: llama-server
    dest: /llama/bin/llama-server
  node_exporter:
    source: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    binary: node_exporter
    dest: /opt/hydra/bin/node_exporter
  nvidia_gpu_exporter:
    source: https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v1.2.1/nvidia_gpu_exporter_1.2.1_linux_x86_64.tar.gz
    binary: nvidia_gpu_exporter
    dest: /opt/hydra/bin/nvidia_gpu_exporter

llama:
  binary: /llama/bin/llama-engine
  working_dir: /llama
  port: 8082
  rpc_port: 9504
  params:
    peer-only: true
  env:
    NVIDIA_VISIBLE_DEVICES: "1"
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    LD_LIBRARY_PATH: /llama/bin:/usr/local/cuda-13.2/lib64

health:
  # #399: the health checker now supports simple mode for peer-only nodes
  # (auto-detected via params.peer-only: true). It just checks HTTP 200
  # on the path — no []SlotStatus decode needed. Use /health which
  # returns {"status":"ok"} in peer-only mode. See #399.
  path: /health
  max_fails: 10

services:
  promtail:
    enabled: false
  node_exporter:
    enabled: false
  nvidia_exporter:
    enabled: false
