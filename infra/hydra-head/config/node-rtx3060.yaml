# Hydra Head - RTX 3060 Node Configuration (model-agnostic)
# Tesla RTX 3060 (sm_86, 12 GB) on the host machine. Sits next to the
# RTX 5060 Ti (sm_120, 16 GB) and can act as its COMBINED-mode peer —
# the two GPUs in `workers.json` form a single logical engine that the
# Coordinator may recruit when a request is too large for one GPU's VRAM
# budget. Also runs as a SOLO decode worker when free.
#
# All model-specific config lives in models.json; this file is pure process/infra.

node:
  name: rtx3060
  mode: container

binaries:
  llama-server:
    # Fat binary: sm_86 (Ampere, this card) + sm_120a (Blackwell, the
    # RTX 5060 Ti sitting next door on the same host). Same OCI image
    # as node-rtx.yaml, built + pushed by hydra-build.yml
    # (ddvnguyen/llama.cpp). Defaults to the floating -latest tag;
    # pinned to a specific <arch>-<binary>-<fork-version>-<short-sha>
    # tag by the deploy-llama job's llama-tag-suffix input
    # (.github/workflows/ci.yml, workflow_dispatch).
    #
    # This is the default OCI-pull path. The old local-build
    # bind-mount is now opt-in via docker-compose.hydra.local-build.yml.
    #
    # `binary`/`dest` MUST match `llama.binary` below (llama-engine,
    # not llama-server). See the matching comment in node-rtx.yaml —
    # this filename mismatch caused both host GPU heads to
    # crash-loop on 2026-07-18 (#453/#460). Do not fix a mismatch
    # like this by making the bind mount :rw when the opt-in override
    # is in use; the mount is intentionally read-only.
    source: ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-fb57c87
    image_digest: sha256:c4f1ba36be17ac90debd34b64838fc5629f47a527bd12cbc6d3023f97fcbb8dd
    binary: llama-engine
    dest: /llama/bin/llama-engine
  node_exporter:
    # Exporter sidecars moved off the host and into the in-container
    # hydra-head per PR #363. We bind the host's exporter at the
    # standard port 9100 from the head-rtx container; the 3060 does
    # not need its own copy (one nvidia exporter per host, one node
    # exporter per host is enough).
    source: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    binary: node_exporter
    dest: /opt/hydra/bin/node_exporter
  nvidia_gpu_exporter:
    source: https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v1.2.1/nvidia_gpu_exporter_1.2.1_linux_x86_64.tar.gz
    binary: nvidia_gpu_exporter
    dest: /opt/hydra/bin/nvidia_gpu_exporter

llama:
  # The 3060 is the COMBINED peer. Like the head (rtx), it uses
  # llama-engine so it can start its embedded RPC backend on :9504
  # (this node's `rpc_port` below). Post-v4-merge there's a single
  # unified port per process (no separate --ggml-rpc-port anymore —
  # that flag is a removed no-op on the current binary); the head's
  # `rpc-engine: localhost:9504` in node-rtx.yaml dials this same port.
  # llama-engine accepts both SOLO and peer modes; the head (rtx) is the
  # only one that needs --rpc-engine / --combined-ot-pattern.
  binary: /llama/bin/llama-engine
  working_dir: /llama
  port: 8081                 # 8080 is owned by head-rtx (5060 Ti)
  rpc_port: 9504             # 9503 is the 5060 Ti's llama RPC; 9504 is the 3060's llama RPC (StateGet/Put)
  params:
    peer-only: true

  env:
    # Force this process onto CUDA device 1 (the 3060). 0 is the 5060 Ti.
    NVIDIA_VISIBLE_DEVICES: "1"
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    LD_LIBRARY_PATH: /llama/bin:/usr/local/cuda-13.2/lib64
    LLAMA_CHAT_TEMPLATE_KWARGS: '{"preserve_thinking": true}'

services:
  # Exporter sidecars disabled — head-rtx already publishes node_exporter
  # and nvidia_gpu_exporter on :9100/:9835 on the host's network. A
  # second copy per host would just scrape the same hardware and
  # shadow the canonical Prometheus target.
  node_exporter:
    enabled: false
  nvidia_exporter:
    enabled: false
