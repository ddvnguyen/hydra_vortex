# Hydra Head - RTX 5060 Ti Node - 27B COMBINED Static Profile
# Layer-split COMBINED mode for Qwopus3.6-27B-Coder-Compat-MTP
# Peer: RTX 3060 on localhost:9504, tensor_split 25/40
#
# Peer port fixed to 9504 (was 9506) to match the peer's own `rpc_port` in
# node-rtx3060-27b.yaml and Hydra.Core's `llama_rpc_port` in workers-27b.json
# — see the removedParamsKeys / IsPeerOnly comments in src/head's config.go
# for why there's only one port now (the pre-v4-merge split between
# --rpc-port and --ggml-rpc-port no longer exists on the binary side).
#
# Config updated 2026-07-08: applied best-performing tested config
# from live baseline tests (Phase 1 binary, 16b65ce7):
#   - 21/44 split (21 layers on 3060, 44 on 5060 Ti): best prefill
#   - ub=512 (was 384): less per-chunk overhead
#   - ctx=64K (was 128K): 21/44 + MTP OOMs at 96K (MTP draft needs 160 MB)
#   - q8/q8 KV cache: q5_0 crashes with FA_ALL_QUANTS=OFF
#   - Removed pre-#30 flags (combined-split-mode, combined-tensor-split)
#     replaced by stock tensor-split flag
#
# Baseline results at this config (Phase 1 binary, 16b65ce7):
#   Prefill: 543 tok/s (2969 prompt, max_tokens=1)
#   Decode: 23.36 tok/s with MTP (96.4% draft acceptance, 238/247)
#   VRAM: 5060 Ti 15478 MiB, 3060 7197 MiB

node:
  name: rtx
  mode: container

binaries:
  llama-server:
    source: ghcr.io/ddvnguyen/llama-server:sm86-sm120-engine
    binary: llama-server
    dest: /llama/bin/llama-server
  node_exporter:
    source: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    binary: node_exporter
    dest: /opt/hydra/bin/node_exporter
  nvidia_gpu_exporter:
    source: https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v1.2.1/nvidia_gpu_exporter_1.2.1_linux_x86_64.tar.gz
    binary: nvidia_gpu_exporter
    dest: /opt/hydra/bin/nvidia_gpu_exporter

llama:
  binary: /llama/bin/llama-engine
  working_dir: /llama
  port: 8080
  rpc_port: 9503
  params:
    model: /models/Qwopus3.6-27B-Coder-Compat-MTP-Q5_K_M.gguf
    ctx-size: 60000
    parallel: 1
    ubatch-size: 512
    fit: off
    cache-type-k: q8_0
    cache-type-v: q8_0
    rope-scaling: yarn
    rope-scale: 4
    yarn-orig-ctx: 32768
    rpc-engine: "localhost:9504"
    split-mode: "layer"
    tensor-split: "25/40"
    n-gpu-layers: 65
    override-tensor: "token_embd.weight=CPU"
    spec-type: "draft-mtp"
    spec-draft-n-max: 3
    spec-draft-p-min: 0.75
    spec-draft-ngl: 0
  env:
    NVIDIA_VISIBLE_DEVICES: "0"
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    LD_LIBRARY_PATH: /llama/bin:/usr/local/cuda-13.2/lib64
    LLAMA_CHAT_TEMPLATE_KWARGS: '{"preserve_thinking": true}'

health:
  path: /slots
  interval_idle_sec: 120
  max_fails: 15

services:
  node_exporter:
    enabled: true
    binary: /opt/hydra/bin/node_exporter
    port: 9100
    args:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
  nvidia_exporter:
    enabled: true
    binary: /opt/hydra/bin/nvidia_gpu_exporter
    port: 9835
    args:
      - "--query-field-names=name,driver_version,gpu_uuid,memory.total,memory.used,memory.free,utilization.gpu,utilization.memory,temperature.gpu,power.draw,clocks.sm,clocks.mem"
