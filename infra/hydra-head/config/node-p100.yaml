# Hydra Head - P100 Node Configuration (model-agnostic)
# Tesla P100 in KVM VM at 192.168.122.21
# All model-specific config lives in models.json; this file is pure process/infra.

node:
  name: p100
  mode: vm

# The P100 VM pushes to the RTX host's OTel Collector gateway.
# global.yaml has otel.url = http://localhost:4318, but from the
# VM localhost is the VM itself. 192.168.122.1 is the RTX host
# (the default gateway / NAT bridge from the KVM VM's perspective).
infra:
  otel:
    url: http://192.168.122.1:4318

binaries:
  llama-server:
    # Built + pushed by hydra-build.yml (ddvnguyen/llama.cpp),
    # arch_sm60 checkbox. P100 runs llama-engine (not llama-server) so
    # the Hydra RPC listener (--rpc-port 9502) is available for
    # cross-node KV restore + P/D decode: llama-server only starts the
    # RPC server in non-router mode, and P100 boots with a resident
    # model (router mode), so the RPC never came up on llama-server
    # (issue #577). The map key stays `llama-server` to match the OCI
    # repo name — the on-disk binary is llama-engine (same convention
    # as node-rtx.yaml). Tag is <arch>-<binary>-<fork-version>-<sha>.
    source: ghcr.io/ddvnguyen/llama-server:sm60-llama-engine-latest
    image_digest: sha256:3d0ef0887b5f44270471aedfc70d00465f5efc9e1d8ac3d141c81eedefd3515c
    binary: llama-engine
    dest: /opt/software/llama-cpp-hydra-sm60/hydra-sm60/bin/llama-engine

llama:
  binary: /opt/software/llama-cpp-hydra-sm60/hydra-sm60/bin/llama-engine
  working_dir: /opt/software/llama-cpp-hydra-sm60/hydra-sm60/bin
  port: 8086
  rpc_port: 9502
  env:
    # Per-service OTel log push (#363). llama-engine on P100
    # is supervised by hydra-head and its stdout is captured
    # by a per-child childWriter (commit 6). The child's OTel
    # resource has service.name=llama-engine; the writer
    # pushes OTLP to the OTel Collector on the RTX host.
    OTEL_SERVICE_NAME: llama-engine
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.168.122.1:4318
  params:
    # Boot-resident model (Q5_K-Balanced — the P/D decode side). Core
    # skips inline PREFILL reload on p100 (workers.json), so this is the
    # only model p100 hosts; models-preset is kept for alias resolution
    # and the same-quant Mini path if inline reload is re-enabled.
    model: /mnt/readonly_data/Qwopus3.6-35B-A3B-v1-APEX-I-Balanced.gguf
    models-preset: /home/vm1/hydra/config/preset-p100.ini
    chat-template-file: /mnt/readonly_data/qwen3.6_merged_template.jinja

    # Context and parallelism
    ctx-size: 128000
    parallel: 1

    # GPU layers
    n-gpu-layers: all
    n-cpu-moe: 26

    # Eager (non-mmap) expert load — cold-expert page-fault fix (epic #470).
    # With --mmap (default) the 26 CPU-resident MoE experts are lazily
    # faulted in from the slow virtio disk on first touch: the first
    # cross-node KV restore + prefill after a cold engine start paid a
    # one-shot tax of +7446 major faults / +4.15 GB RSS / ~11 s (turn-3
    # decode prefill 15.0 s cold vs 4.1 s warm, total 29.6 s vs 6.2 s;
    # instrumented 2026-08-12). no-mmap reads all CPU expert weights
    # eagerly during model load, inside the existing 235-300 s load
    # window (readiness budget 480 s), so the first decode prefill never
    # page-faults. RAM: VM has 16 GB total / ~8 GB CPU-resident expert
    # set (measured via Mapped/RSS deltas) + 27 GB swap backstop — fits.
    no-mmap: true

    # Sampling
    temp: 0.86
    repeat-penalty: 1.06
    top-k: 20
    top-p: 0.95

    # Chat template
    chat-template-kwargs: '{"preserve_thinking": true}'

services:
  # hydra-head manages these as subprocesses (no systemd services
  # for them — the old infra-promtail / node-exporter / nvidia-exporter
  # host services were removed in commit 5f2c231 + this follow-up).
  node_exporter:
    enabled: true
    binary: /home/vm1/.local/bin/node_exporter
    port: 9100
  nvidia_exporter:
    enabled: true
    binary: /home/vm1/.local/bin/nvidia_gpu_exporter
    port: 9835
    args:
      - "--query-field-names=name,driver_version,gpu_uuid,memory.total,memory.used,memory.free,utilization.gpu,utilization.memory,temperature.gpu,power.draw,clocks.sm,clocks.mem"

# P100 lives in a KVM VM with a slow virtio disk. Model load
# (eager-read of the ~25 GB GGUF since no-mmap: true, above) takes
# 235-300s+ on this hardware, so the readiness miss-deadline must be
# generous: the old health.max_fails=30 (≈30 min budget) was tuned for
# that. With sentinel-based readiness the default 180s timeout is fine
# for router mode (no boot model), but keep the slower budget explicit
# in case a boot-resident model is configured.
readiness:
  timeout_sec: 480
