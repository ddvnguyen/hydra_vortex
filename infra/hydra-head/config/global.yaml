# Hydra Head - Global Configuration
# Shared parameters across all nodes

node:
  mode: vm  # default mode, can be overridden per node

# NOTE: model/engine params are now in models.json engine_defaults (D4).
# The llama.params block below is kept temporarily for hydra-head (Go) launch
# compatibility until the Go side reads models.json directly.
llama:
  binary: /usr/local/bin/llama-server
  host: 0.0.0.0
  params:
    flash-attn: on
    cache-type-v: q8_0
    cache-type-k: q8_0
    kv-unified: true
    cont-batching: true
    cache-prompt: true
    cache-reuse: 64
    prio: 3
    prio-batch: 1
    rope-scaling: yarn
    rope-scale: 4
    yarn-orig-ctx: 32768
    reasoning: on
    jinja: true
    timeout: 1800
    chat-template-kwargs: '{"preserve_thinking": true}'
    log-prefix: false
    metrics: true
    slots: true
    perf: true
    log-verbosity: 4
    context-shift: true

infra:
  prometheus:
    host: localhost
    port: 9091
  loki:
    url: http://localhost:3100
  grafana:
    url: http://localhost:3000
  otel:
    # OTel Collector gateway — hydra-head pushes OTLP/HTTP here.
    # The collector (Quadlet infra-otel-collector) lives on
    # the RTX host's port 4318 and fans out to Loki. P100
    # overrides this to http://192.168.122.1:4318.
    url: http://localhost:4318

services:
  node_exporter:
    enabled: false
  nvidia_exporter:
    enabled: false

# Readiness for the llama-engine subprocess (event-driven, no HTTP polling).
# hydra-head is the parent of llama-engine, so it learns readiness from the
# child's own stdout: when a line contains any sentinel below, the process
# transitions to StateReady. The old `health` block drove a periodic HTTP
# poll of llama's /slots endpoint — that woke llama-engine up pointlessly
# and reported "ready" as soon as the port bound, even before the model was
# loaded. Removed in favour of sentinel-based readiness.
#
# timeout_sec is the miss-deadline: if no sentinel appears within this
# window after spawn, the process is marked SUSPECT (started, not ready).
# A generous default covers slow VM disks (P100 model load = 235-300s).
readiness:
  sentinels:
    - "hydra-engine ready"
    - "server is listening on"
    - "router server is listening on"
    - "model loaded"
  timeout_sec: 180
