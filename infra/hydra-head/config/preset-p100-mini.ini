; ── P100 (sm_60, KVM VM) — Mini-quant variant for issue #469 isolation ──
; GGUF-FILE alias (not a Hydra routing identity). Same-quant P/D test: P100
; loads the SAME Mini quant as RTX prefill so the cross-node KV handoff runs
; quant-matched on both ends. This is a SEPARATE preset file from
; preset-p100.ini (which carries the Balanced decode alias) on purpose: the
; #469 test must not inherit or be affected by changes to the main P100
; balanced/decode preset. Core translates moe-35b-pd-mini -> qwen3.6-35B-mini
; via models.json's model_file_aliases dict and sends that on PREFILL.

[qwen3.6-35B-mini]
model    = /mnt/readonly_data/Qwopus3.6-35B-A3B-v1-APEX-I-Mini.gguf
n-cpu-moe = 26
override-tensor = token_embd\.weight=CPU
alias    = qwen3.6-35B-mini
