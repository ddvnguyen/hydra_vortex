; ── RTX 5060 Ti (sm_120, host, 16 GB) — preset for inline PREFILL model reload ──
; Aliases are GGUF-FILE identities (the actual quant on disk), NOT Hydra
; routing identities (moe-35b-solo, moe-35b-pd, ...). Core translates a
; routing identity -> GGUF-file alias via the model_file_aliases dict in
; models.json, then sends that alias as the PREFILL `model` field. The
; engine resolves it here in preset_alias_to_path and reloads inline when
; it differs from the resident GGUF — no extra RPC, no router mode.
;
; Lists EVERY GGUF this worker can host (16 GB fits all three 35B/27B
; quants) so Core can swap to any of them. node-rtx.yaml loads mini at
; startup (resident = mini); sending a non-resident alias triggers the
; inline reload.

[qwen3.6-35B-mini]
model    = /models/Qwopus3.6-35B-A3B-v1-APEX-I-Mini.gguf
n-cpu-moe = 8
override-tensor = token_embd\.weight=CPU,output\.weight=CPU,output_norm\.weight=CPU
alias    = qwen3.6-35B-mini

[qwen3.6-35B-balanced]
model    = /models/Qwopus3.6-35B-A3B-v1-APEX-I-Balanced.gguf
n-cpu-moe = 30
override-tensor = token_embd\.weight=CPU
alias    = qwen3.6-35B-balanced

[qwen3.6-27B-coder]
model    = /models/Qwopus3.6-27B-Coder-Compat-MTP-Q5_K_M.gguf
n-gpu-layers = 65
override-tensor = token_embd.weight=CPU
alias    = qwen3.6-27B-coder
