; ── P100 (sm_60, KVM VM 192.168.122.21, 16 GB) — preset for inline reload ──
; GGUF-FILE aliases (not Hydra routing identities). P100 is the DECODE side
; for moe-35b-pd / moe-35b-pd-mix (Q5_K-Balanced) and can also host the Mini
; quant (issue #469 same-quant test). Lists both GGUF files available on the
; VM at /mnt/readonly_data/ so Core can swap between them. Core translates the
; routing identity -> qwen3.6-35B-balanced / qwen3.6-35B-mini via models.json's
; model_file_aliases dict and sends that alias on the request.
; (27B-coder is host-only and not present on the VM, so it is omitted here.)

[qwen3.6-35B-balanced]
model    = /mnt/readonly_data/Qwopus3.6-35B-A3B-v1-APEX-I-Balanced.gguf
n-cpu-moe = 26
override-tensor = token_embd\.weight=CPU
alias    = qwen3.6-35B-balanced

[qwen3.6-35B-mini]
model    = /mnt/readonly_data/Qwopus3.6-35B-A3B-v1-APEX-I-Mini.gguf
n-cpu-moe = 26
override-tensor = token_embd\.weight=CPU
alias    = qwen3.6-35B-mini
