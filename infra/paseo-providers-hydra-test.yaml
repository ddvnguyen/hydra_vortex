# Paseo provider prep for Hydra TEST — lead to copy to ~/.paseo/providers.yaml after rig is up.
# Paseo daemon will pick this up on next config reload.
# See docs/hydra-test.md "How to Point a Paseo Workflow at It".

providers:
  - id: hydra-test
    type: openai-compat
    base_url: http://192.168.122.21:19000 # P100 VM is at 192.168.122.21; Paseo agent on the host uses this URL. If the Paseo daemon runs INSIDE the P100 VM, change to http://localhost:19000.
    default_model: minicpm5-1b
    api_key: "" # Hydra.Core doesn't require auth in test; empty api_key is fine.
    description: Hydra TEST instance (2-core P/D split on P100 VM, dedicated hydra_test DB)
    # routing: Paseo agent workflows set provider: hydra-test per-workflow;
    # the second core is at http://localhost:19001 (Tests.AgentWorkflow hits both).
    # Model alias minicpm5-1b is the test rig's lightweight default; check
    # infra/hydra-core/config/models.json for the full alias map.
