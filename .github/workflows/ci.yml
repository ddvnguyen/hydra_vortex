name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "llama.cpp*"
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [deploy-llama]
  workflow_dispatch:
    inputs:
      deploy-llama:
        description: "Deploy llama-server to RTX + P100"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rtx-image:
        description: >
          Full OCI image ref to pin for RTX nodes (blank = use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-a157edf
        required: false
        default: ""
        type: string
      p100-image:
        description: >
          Full OCI image ref to pin for P100 (blank = use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm60-llama-server-a157edf
        required: false
        default: ""
        type: string

permissions:
  checks: write
  contents: read
  issues: write

jobs:
  # ── Build & Unit Test (every push/PR) ──────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: self-hosted
    timeout-minutes: 30
    # Never run on a fork's pull request — fork PRs can execute arbitrary code
    # on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Cancel duplicate queued runs
        run: |
          gh run list --workflow CI --branch "${{ github.ref_name }}" \
            --json databaseId,status,event \
            --jq ".[] | select(.status == \"queued\" and .event == \"${{ github.event_name }}\") | .databaseId" |
          while read id; do
            [ "$id" != "${{ github.run_id }}" ] && gh run cancel "$id" 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Restore & build (.NET)
        run: dotnet build src/Hydra.sln -c Release --nologo -v minimal

      - name: Unit tests — Shared
        run: |
          dotnet test src/core/Tests.Shared/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=shared.trx" \
            --results-directory TestResults/

      - name: Unit tests — Core (fast)
        run: |
          dotnet test src/core/Tests.Core/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --filter "FullyQualifiedName!~Integration" \
            --logger "trx;LogFileName=core-fast.trx" \
            --results-directory TestResults/

      - name: Unit tests — Core (integration)
        run: |
          dotnet test src/core/Tests.Core/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --filter "FullyQualifiedName~Integration" \
            --logger "trx;LogFileName=core-integration.trx" \
            --results-directory TestResults/

      - name: Unit tests — E2E (hermetic)
        run: |
          # Pre-pull the pinned postgres image so Aspire DCP doesn't
          # block on a network pull during the test run.
          docker pull postgres:16 2>/dev/null || podman pull docker.io/library/postgres:16 2>/dev/null || true
          dotnet test src/core/Tests.E2E/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults/

      - name: Restore & build (Go head)
        run: |
          export PATH=$HOME/go-sdk/go/bin:$PATH
          go build -C $GITHUB_WORKSPACE/src/head -o /dev/null .
          go vet -C $GITHUB_WORKSPACE/src/head ./...

      - name: Unit tests — Go head
        run: |
          set -eo pipefail
          export PATH=$HOME/go-sdk/go/bin:$PATH
          go test -C $GITHUB_WORKSPACE/src/head -count=1 -v ./... 2>&1 | tee /tmp/go-test.log

      - name: Publish .NET test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Unit Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ github.run_number }}
          path: TestResults/*.trx
          retention-days: 30

      - name: Clean .NET download cache
        if: always()
        run: dotnet nuget locals http-cache --clear --force-english-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy llama-engine (tag push / repository_dispatch / manual) ────
  # Deploys ONLY when triggered by a matching tag, repository_dispatch
  # from the fork, or explicit manual dispatch.  Commits and PRs never
  # trigger deploy.
  deploy-llama:
    name: Deploy hydra-head (3 GPU nodes)
    runs-on: self-hosted
    timeout-minutes: 35
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HYDRA_HEAD_AUTH_TOKEN: ${{ secrets.HYDRA_HEAD_AUTH_TOKEN }}
    if: |
      startsWith(github.ref, 'refs/tags/llama.cpp') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-llama == 'true')

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select profile (.env)
        run: bash scripts/set-profile.sh moe

      - name: Pin llama-server OCI image (if requested)
        id: pin
        if: |
          github.event.inputs.rtx-image != '' ||
          github.event.inputs.p100-image != '' ||
          github.event.client_payload.rtx-image != '' ||
          github.event.client_payload.p100-image != ''
        run: |
          pin_image() {
            local image="$1"
            local config_file="$2"
            echo "Pinning $image in $config_file"
            sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*source:\s*\).*|\1${image}|" "$config_file"
            local digest
            digest=$(podman pull "$image" 2>/dev/null && podman inspect "$image" --format '{{.Digest}}' 2>/dev/null || echo "")
            if [ -n "$digest" ]; then
              echo "Resolved digest: $digest"
              if grep -q 'image_digest:' "$config_file"; then
                sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*image_digest:\s*\).*|\1${digest}|" "$config_file"
              else
                sed -i "/^\s*source:\s*${image}$/a\\    image_digest: ${digest}" "$config_file"
              fi
            else
              echo "WARNING: Could not resolve digest for $image"
            fi
          }

          RTX_IMAGE="${{ github.event.inputs.rtx-image || github.event.client_payload.rtx-image }}"
          P100_IMAGE="${{ github.event.inputs.p100-image || github.event.client_payload.p100-image }}"

          [ -n "$RTX_IMAGE" ] && pin_image "$RTX_IMAGE" infra/hydra-head/config/node-rtx.yaml && pin_image "$RTX_IMAGE" infra/hydra-head/config/node-rtx3060.yaml && echo "rtx_image=$RTX_IMAGE" >> "$GITHUB_OUTPUT"
          [ -n "$P100_IMAGE" ] && pin_image "$P100_IMAGE" infra/hydra-head/config/node-p100.yaml && echo "p100_image=$P100_IMAGE" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- infra/hydra-head/config/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- infra/hydra-head/config/
          fi

      - name: Commit pinned image
        if: ${{ steps.pin.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/hydra-head/config/node-rtx.yaml infra/hydra-head/config/node-rtx3060.yaml infra/hydra-head/config/node-p100.yaml
          git commit -m "chore: pin llama-server OCI image

          rtx-image: ${{ github.event.inputs.rtx-image || '(unchanged)' }}
          p100-image: ${{ github.event.inputs.p100-image || '(unchanged)' }}

          Triggered by deploy-llama workflow_dispatch (${{ github.actor }})."
          git push origin HEAD:${{ github.ref_name }}

      - name: Ensure SSH config for P100
        run: |
          grep -q "Host hydra-p100" ~/.ssh/config 2>/dev/null || cat >> ~/.ssh/config <<'EOF'

          Host hydra-p100
              HostName 192.168.122.21
              User vm1
              IdentityFile ~/.ssh/vm_agent_01
              IdentitiesOnly yes
          EOF

      - name: Deploy hydra-head to RTX (container)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh rtx
          bash scripts/ci/wait-for-head.sh "hydra-head-rtx" "http://localhost:9700/status" 480 "hydra-system_head-rtx5060ti_1"

      - name: Deploy hydra-head to RTX 3060 (container)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh rtx3060
          bash scripts/ci/wait-for-head.sh "hydra-head-rtx3060" "http://localhost:9701/status" 480 "hydra-system_head-rtx3060_1"

      - name: Deploy hydra-head to P100 (VM systemd)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh p100
          bash scripts/ci/wait-for-head.sh "hydra-head-p100" "http://192.168.122.21:9700/status" 480

      - name: Verify deployed digests
        run: |
          set -eo pipefail
          echo "Verifying deployed engine binaries..."

          extract_digest() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$config"
          }
          extract_source() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$config"
          }

          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)

          echo "RTX pinned: source=$RTX_SOURCE digest=$RTX_DIGEST"
          echo "P100 pinned: source=$P100_SOURCE digest=$P100_DIGEST"

          FAIL=0
          verify_head() {
            local label="$1" endpoint="$2" expected_digest="$3"
            local status_json
            status_json=$(curl -sf --max-time 10 "$endpoint" 2>/dev/null) || {
              echo "FAIL: $label ($endpoint) not responding"; FAIL=1; return
            }
            local actual_digest
            actual_digest=$(echo "$status_json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          info = data.get('binaries', {}).get('llama-server') or {}
          print(info.get('pulled_digest', ''))
          " 2>/dev/null || echo "")
            if [ -z "$actual_digest" ]; then
              echo "FAIL: $label — no pulled_digest"; FAIL=1; return
            fi
            if [ "$expected_digest" = "$actual_digest" ]; then
              echo "OK: $label — digest matches: $actual_digest"
            else
              echo "FAIL: $label — digest mismatch (expected=$expected_digest actual=$actual_digest)"; FAIL=1
            fi
          }

          if [ -z "$RTX_DIGEST" ]; then
            echo "FAIL: no image_digest pinned for RTX"; FAIL=1
          else
            verify_head "hydra-head-rtx" "http://localhost:9700/status" "$RTX_DIGEST"
            verify_head "hydra-head-rtx3060" "http://localhost:9701/status" "$RTX_DIGEST"
          fi
          if [ -z "$P100_DIGEST" ]; then
            echo "FAIL: no image_digest pinned for P100"; FAIL=1
          else
            verify_head "hydra-head-p100" "http://192.168.122.21:9700/status" "$P100_DIGEST"
          fi
          [ "$FAIL" -ne 0 ] && exit 1
          echo "All heads verified — digests match pinned config"

      - name: Write deploy summary
        if: always()
        run: |
          TAG="${{ github.ref_name }}"
          extract_source() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$1"
          }
          extract_digest() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$1"
          }
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## hydra-head Deploy

          | Field | Value |
          |-------|-------|
          | Tag   | \`$TAG\` |
          | RTX image | \`${RTX_SOURCE}\` |
          | RTX digest | \`${RTX_DIGEST}\` |
          | P100 image | \`${P100_SOURCE}\` |
          | P100 digest | \`${P100_DIGEST}\` |
          | By    | ${{ github.actor }} |
          | Time  | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          **RTX**: hydra-head container on :9700
          **RTX 3060**: hydra-head container on :9701
          **P100**: hydra-head systemd service on 192.168.122.21:9700
          SUMMARY
