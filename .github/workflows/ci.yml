name: CI

on:
  push:
    branches: [main]
    tags:
      - "llama.cpp*"
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [deploy-llama]
  workflow_dispatch:
    inputs:
      deploy-llama:
        description: "Deploy llama-server to RTX + P100"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rtx-image:
        description: >
          Full OCI image ref to pin for RTX nodes (blank = use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-a157edf
        required: false
        default: ""
        type: string
      p100-image:
        description: >
          Full OCI image ref to pin for P100 (blank = use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm60-llama-server-a157edf
        required: false
        default: ""
        type: string
      runner:
        description: >
          Runner pool for build-test. auto = ubuntu-latest, falling back to
          self-hosted only when cloud is busy (>= CI_CLOUD_BUSY_THRESHOLD
          in-progress ubuntu-latest jobs) or CI_RUNNER=self-hosted is set.
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "cloud"
          - "self-hosted"

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ── Decide which runner pool build-test uses ──────────────────────────
  # Cloud (ubuntu-latest) by default. Falls back to the self-hosted runner
  # only when (a) explicitly chosen via the workflow_dispatch `runner` input,
  # (b) the CI_RUNNER repo variable is set to "self-hosted", or (c) in auto
  # mode >= CI_CLOUD_BUSY_THRESHOLD jobs are already running on ubuntu-latest.
  # The local runner stays reserved for deploys / live-rig tests; build-test
  # only lands on it as a safety valve.
  resolve-runner:
    name: Resolve build-test runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - name: Decide runner pool
        id: pick
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          SELECTION="${{ inputs.runner || 'auto' }}"
          THRESHOLD="${{ vars.CI_CLOUD_BUSY_THRESHOLD || 4 }}"

          choose() {
            echo "runner=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
          }

          # 1. Explicit per-trigger choice wins.
          if [ "$SELECTION" = "self-hosted" ]; then
            choose "self-hosted" "workflow_dispatch input"
            exit 0
          fi
          if [ "$SELECTION" = "cloud" ]; then
            choose "ubuntu-latest" "workflow_dispatch input"
            exit 0
          fi
          # 2. Repo variable overrides the auto default globally.
          if [ "${{ vars.CI_RUNNER }}" = "self-hosted" ]; then
            choose "self-hosted" "CI_RUNNER variable"
            exit 0
          fi

          # 3. Auto: cloud first; fall back to self-hosted only when cloud is
          #    already busy. Count in-progress jobs labelled ubuntu-latest,
          #    excluding this run's own resolve job.
          BUSY=0
          for RID in $(gh api "repos/${REPO}/actions/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' 2>/dev/null || true); do
            [ "$RID" = "$RUN_ID" ] && continue
            N=$(gh api "repos/${REPO}/actions/runs/${RID}/jobs" \
              --jq '[.jobs[] | select(.status=="in_progress") | select(.labels | index("ubuntu-latest"))] | length' \
              2>/dev/null || echo 0)
            BUSY=$((BUSY + N))
          done

          echo "Cloud in-progress ubuntu-latest jobs: ${BUSY} (threshold ${THRESHOLD})"
          if [ "${BUSY}" -ge "${THRESHOLD}" ]; then
            choose "self-hosted" "cloud busy (${BUSY} >= ${THRESHOLD})"
          else
            choose "ubuntu-latest" "cloud available (${BUSY} < ${THRESHOLD})"
          fi

  # ── Build & Unit Test (every push/PR) ──────────────────────────────────
  build-test:
    name: Build & Test
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    timeout-minutes: 60
    # Serialize per-branch so a push and a pull_request run for the same
    # commit never race on the shared self-hosted Postgres. The key unifies
    # both events: push uses github.ref_name (branch), pull_request uses the
    # head branch. The newest run in the group cancels older ones.
    concurrency:
      group: build-test-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true
    # Never run on a fork's pull request — fork PRs can execute arbitrary code,
    # and this job may land on the self-hosted runner (which has the live rig)
    # when cloud is busy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Verify live-hardware jobs stay unreachable from push/PR
        run: python3 scripts/ci/check-live-hardware-gating.py

      # Toolchains only needed on the cloud pool — the self-hosted runner
      # already has the system .NET 10 SDK and ~/go-sdk on PATH. Skipping
      # here avoids re-downloading the SDK on every self-hosted run.
      - uses: actions/setup-dotnet@v4
        if: needs.resolve-runner.outputs.runner == 'ubuntu-latest'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        if: needs.resolve-runner.outputs.runner == 'ubuntu-latest'
        with:
          go-version-file: src/head/go.mod
          cache: true

      - name: Reset stale .NET build servers
        # This runner is also the host for the live GPU inference stack, so
        # it can be under enough memory pressure to abort the CLR mid-startup
        # (exit 134). A poisoned VBCSCompiler/MSBuild server socket from a
        # prior abort then fails the *next* build too. Clear it before we start.
        run: dotnet build-server shutdown || true

      - name: Restore & build (.NET)
        run: |
          for attempt in 1 2; do
            if dotnet build src/Hydra.sln -c Release --nologo -v minimal; then
              exit 0
            fi
            code=$?
            if [ "$code" != "134" ] || [ "$attempt" == "2" ]; then
              exit "$code"
            fi
            echo "::warning::dotnet build aborted (exit 134, CLR fatal error) on attempt $attempt — likely runner memory pressure. Resetting build servers, clearing stale outputs, and retrying."
            dotnet build-server shutdown || true
            # A CLR abort mid-write can leave a corrupt DLL whose timestamp is
            # newer than its sources; an incremental build then treats it as
            # up-to-date and the `--no-build` test steps load garbage. Force a
            # clean tree so the retry actually rewrites every output.
            find src -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} + 2>/dev/null || true
            sleep 5
          done

      # Some Core unit tests (StoreMetadataTests, WriteBehindServiceTests)
      # need Postgres. The self-hosted runner already runs one on 5432; the
      # cloud pool must provision an identical one (db/user/pw = hydra_store/
      # hydra/hydra). E2E's Aspire Postgres binds a dynamic port, so no clash.
      - name: Start Postgres for Core unit tests
        if: needs.resolve-runner.outputs.runner == 'ubuntu-latest'
        run: |
          docker rm -f hydra-test-pg >/dev/null 2>&1 || true
          docker run -d --name hydra-test-pg \
            -e POSTGRES_DB=hydra_store -e POSTGRES_USER=hydra -e POSTGRES_PASSWORD=hydra \
            -p 5432:5432 postgres:16 >/dev/null
          for i in $(seq 1 30); do
            if docker exec hydra-test-pg pg_isready -U hydra -d hydra_store >/dev/null 2>&1; then
              echo "Postgres ready on 127.0.0.1:5432"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres container did not become ready" >&2
          docker logs hydra-test-pg >&2 || true
          exit 1

      - name: Unit tests — Shared
        run: |
          dotnet test src/core/Tests.Shared/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=shared.trx" \
            --results-directory TestResults/

      - name: Unit tests — Core (fast)
        run: |
          dotnet test src/core/Tests.Core/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --filter "FullyQualifiedName!~Integration" \
            --logger "trx;LogFileName=core-fast.trx" \
            --results-directory TestResults/

      - name: Unit tests — Core (integration)
        run: |
          dotnet test src/core/Tests.Core/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --filter "FullyQualifiedName~Integration" \
            --logger "trx;LogFileName=core-integration.trx" \
            --results-directory TestResults/

      - name: Restore & build (Go head)
        run: |
          export PATH=$HOME/go-sdk/go/bin:$PATH
          go build -C $GITHUB_WORKSPACE/src/head -o /dev/null .
          go vet -C $GITHUB_WORKSPACE/src/head ./...

      - name: Unit tests — Go head
        run: |
          set -eo pipefail
          export PATH=$HOME/go-sdk/go/bin:$PATH
          go test -C $GITHUB_WORKSPACE/src/head -count=1 -v ./... 2>&1 | tee /tmp/go-test.log

      - name: Publish .NET test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Unit Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ github.run_number }}
          path: TestResults/*.trx
          retention-days: 30

      - name: Clean .NET download cache
        if: always()
        run: dotnet nuget locals http-cache --clear --force-english-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy llama-engine (tag push / repository_dispatch / manual) ────
  # Deploys ONLY when triggered by a matching tag, repository_dispatch
  # from the fork, or explicit manual dispatch.  Commits and PRs never
  # trigger deploy.
  deploy-llama:
    name: Deploy hydra-head (3 GPU nodes)
    runs-on: self-hosted
    timeout-minutes: 35
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      HYDRA_HEAD_AUTH_TOKEN: ${{ secrets.HYDRA_HEAD_AUTH_TOKEN }}
    if: |
      startsWith(github.ref, 'refs/tags/llama.cpp') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-llama == 'true')

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select profile (.env)
        run: bash scripts/set-profile.sh moe

      - name: Pin llama-server OCI image (if requested)
        id: pin
        if: |
          github.event.inputs.rtx-image != '' ||
          github.event.inputs.p100-image != '' ||
          github.event.client_payload.rtx-image != '' ||
          github.event.client_payload.p100-image != ''
        run: |
          pin_image() {
            local image="$1"
            local config_file="$2"
            echo "Pinning $image in $config_file"
            sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*source:\s*\).*|\1${image}|" "$config_file"
            local digest
            digest=$(podman pull "$image" 2>/dev/null && podman inspect "$image" --format '{{.Digest}}' 2>/dev/null || echo "")
            if [ -n "$digest" ]; then
              echo "Resolved digest: $digest"
              if grep -q 'image_digest:' "$config_file"; then
                sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*image_digest:\s*\).*|\1${digest}|" "$config_file"
              else
                sed -i "/^\s*source:\s*${image}$/a\\    image_digest: ${digest}" "$config_file"
              fi
            else
              echo "WARNING: Could not resolve digest for $image"
            fi
          }

          RTX_IMAGE="${{ github.event.inputs.rtx-image || github.event.client_payload.rtx-image }}"
          P100_IMAGE="${{ github.event.inputs.p100-image || github.event.client_payload.p100-image }}"

          [ -n "$RTX_IMAGE" ] && pin_image "$RTX_IMAGE" infra/hydra-head/config/node-rtx.yaml && pin_image "$RTX_IMAGE" infra/hydra-head/config/node-rtx3060.yaml && echo "rtx_image=$RTX_IMAGE" >> "$GITHUB_OUTPUT"
          [ -n "$P100_IMAGE" ] && pin_image "$P100_IMAGE" infra/hydra-head/config/node-p100.yaml && echo "p100_image=$P100_IMAGE" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- infra/hydra-head/config/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- infra/hydra-head/config/
          fi

      - name: Commit pinned image (PR)
        if: ${{ steps.pin.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deploy-llama/pin-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add infra/hydra-head/config/node-rtx.yaml infra/hydra-head/config/node-rtx3060.yaml infra/hydra-head/config/node-p100.yaml
          git commit -m "chore: pin llama-server OCI image

          rtx-image: ${{ github.event.inputs.rtx-image || '(unchanged)' }}
          p100-image: ${{ github.event.inputs.p100-image || '(unchanged)' }}

          Triggered by deploy-llama workflow_dispatch (${{ github.actor }})."
          # main is branch-protected (requires "Build & Test" before merge,
          # added in PR #517), so a direct push from this job's GITHUB_TOKEN
          # is rejected with GH006. Land the pin via a PR instead; the deploy
          # steps below still use the pinned config from this working tree,
          # so a persistence failure must warn rather than fail the deploy.
          if git push origin "$BRANCH"; then
            echo "Pushed pin branch $BRANCH."
            gh pr create --base main --head "$BRANCH" \
              --title "chore: pin llama-server OCI image (deploy-llama)" \
              --body "Automatic image pin from deploy-llama (${{ github.actor }}). Deploy already applied this pin to the live rig; this PR persists it to main." \
              --label review-finding \
            || echo "::warning::gh pr create failed; the pin lives on branch $BRANCH — open a PR manually to persist it."
          else
            echo "::warning::Could not push pin branch $BRANCH. Deploy continues using the pinned config from this checkout; open a PR to persist the pin."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure SSH config for P100
        run: |
          grep -q "Host hydra-p100" ~/.ssh/config 2>/dev/null || cat >> ~/.ssh/config <<'EOF'

          Host hydra-p100
              HostName 192.168.122.21
              User vm1
              IdentityFile ~/.ssh/vm_agent_01
              IdentitiesOnly yes
          EOF

      - name: Deploy hydra-head to RTX (container)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh rtx
          bash scripts/ci/wait-for-head.sh "hydra-head-rtx" "http://localhost:9700/status" 480 "hydra-system_head-rtx5060ti_1"

      - name: Deploy hydra-head to RTX 3060 (container)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh rtx3060
          bash scripts/ci/wait-for-head.sh "hydra-head-rtx3060" "http://localhost:9701/status" 480 "hydra-system_head-rtx3060_1"

      - name: Deploy hydra-head to P100 (VM systemd)
        run: |
          bash $GITHUB_WORKSPACE/scripts/deploy-hydra-head.sh p100
          bash scripts/ci/wait-for-head.sh "hydra-head-p100" "http://192.168.122.21:9700/status" 480

      - name: Verify deployed digests
        run: |
          set -eo pipefail
          echo "Verifying deployed engine binaries..."

          extract_digest() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$config"
          }
          extract_source() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$config"
          }

          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)

          echo "RTX pinned: source=$RTX_SOURCE digest=$RTX_DIGEST"
          echo "P100 pinned: source=$P100_SOURCE digest=$P100_DIGEST"

          FAIL=0
          verify_head() {
            local label="$1" endpoint="$2" expected_digest="$3"
            local status_json
            status_json=$(curl -sf --max-time 10 "$endpoint" 2>/dev/null) || {
              echo "FAIL: $label ($endpoint) not responding"; FAIL=1; return
            }
            local actual_digest
            actual_digest=$(echo "$status_json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          info = data.get('binaries', {}).get('llama-server') or {}
          print(info.get('pulled_digest', ''))
          " 2>/dev/null || echo "")
            if [ -z "$actual_digest" ]; then
              echo "FAIL: $label — no pulled_digest"; FAIL=1; return
            fi
            if [ "$expected_digest" = "$actual_digest" ]; then
              echo "OK: $label — digest matches: $actual_digest"
            else
              echo "FAIL: $label — digest mismatch (expected=$expected_digest actual=$actual_digest)"; FAIL=1
            fi
          }

          if [ -z "$RTX_DIGEST" ]; then
            echo "FAIL: no image_digest pinned for RTX"; FAIL=1
          else
            verify_head "hydra-head-rtx" "http://localhost:9700/status" "$RTX_DIGEST"
            verify_head "hydra-head-rtx3060" "http://localhost:9701/status" "$RTX_DIGEST"
          fi
          if [ -z "$P100_DIGEST" ]; then
            echo "FAIL: no image_digest pinned for P100"; FAIL=1
          else
            verify_head "hydra-head-p100" "http://192.168.122.21:9700/status" "$P100_DIGEST"
          fi
          [ "$FAIL" -ne 0 ] && exit 1
          echo "All heads verified — digests match pinned config"

      - name: Write deploy summary
        if: always()
        run: |
          TAG="${{ github.ref_name }}"
          extract_source() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$1"
          }
          extract_digest() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$1"
          }
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## hydra-head Deploy

          | Field | Value |
          |-------|-------|
          | Tag   | \`$TAG\` |
          | RTX image | \`${RTX_SOURCE}\` |
          | RTX digest | \`${RTX_DIGEST}\` |
          | P100 image | \`${P100_SOURCE}\` |
          | P100 digest | \`${P100_DIGEST}\` |
          | By    | ${{ github.actor }} |
          | Time  | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          **RTX**: hydra-head container on :9700
          **RTX 3060**: hydra-head container on :9701
          **P100**: hydra-head systemd service on 192.168.122.21:9700
          SUMMARY
