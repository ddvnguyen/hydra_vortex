name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # INTENTIONAL tradeoff: the push trigger is narrowed to main (like
    # ci.yml). gitleaks has no shared-state race, so this is NOT about
    # Postgres — it's so each PR commit produces exactly ONE scan. Keeping
    # push: ["**"] would fire a second, push-triggered run per PR commit
    # that gets superseded/cancelled by the PR run and shows up as noise in
    # the checks list. The PR's diff scan (origin/main..HEAD) still covers
    # every commit on the branch, and main pushes run a 100-commit scan.
    # The per-branch group (cancel-in-progress: false) prevents a main push
    # and a PR run from producing redundant overlapping scans.
    concurrency:
      group: secret-scan-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full depth so gitleaks can walk the entire commit history,
          # not just the shallow clone GitHub Actions creates by default.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.27.2
          FILE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${FILE}" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p ~/bin
          mv /tmp/gitleaks ~/bin/gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/gitleaks version

      - name: Scan — recent commits (push)
        if: github.event_name == 'push'
        run: |
          # Scan last 100 commits to catch regressions without failing on
          # ancient unfixable leaks deep in history. PRs use diff-only scan.
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --verbose \
            --log-opts="--max-count=100" \
            --exit-code 1

      - name: Scan — PR diff only (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --verbose \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --exit-code 1
