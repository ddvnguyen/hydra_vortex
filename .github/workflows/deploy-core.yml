name: Deploy Hydra Core

on:
  workflow_dispatch:
    inputs:
      run-liverig:
        description: "Run Tests.LiveRig against the rig after deploy (Tier 2)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Core
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false
    env:
      HYDRA_HEAD_AUTH_TOKEN: ${{ secrets.HYDRA_HEAD_AUTH_TOKEN }}
      COORD_URL: http://localhost:9000
      LLAMA_RTX_URL: http://localhost:8080
      LLAMA_P100_URL: http://192.168.122.21:8086
      COORD_METRICS_URL: http://localhost:9501/metrics
      STORE_HOST: 127.0.0.1
      STORE_PORT: "9500"

    steps:
      - uses: actions/checkout@v4

      - name: Select profile
        run: bash scripts/set-profile.sh moe

      - name: Read version
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "rev=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: |
          set -eo pipefail
          podman build --target core -f infra/Dockerfile \
            -t localhost/hydra-core:latest . \
            2>&1 | tee /tmp/hydra-build-core.log | tail -3
          podman build -f infra/llama-rtx-node/Dockerfile_26.04_cuda13.2 \
            -t hydra-cuda-base:latest infra/llama-rtx-node \
            2>&1 | tee /tmp/hydra-build-cuda-base.log | tail -3
          export PATH=$HOME/go-sdk/go/bin:$PATH
          # -C changes dir, so a relative -o resolves under src/head — the
          # Dockerfile.rtx COPY expects <repo>/bin/hydra-head (same as
          # deploy-hydra-head.sh). Use an absolute output path.
          go build -C src/head -o "${{ github.workspace }}/bin/hydra-head" . \
            2>&1 | tee /tmp/hydra-build-head.log | tail -3
          podman build -f infra/hydra-head/Dockerfile.rtx \
            -t localhost/hydra-head:rtx . \
            2>&1 | tee /tmp/hydra-build-head-rtx.log | tail -3
          echo "Build complete"

      - name: Deploy Hydra Core
        run: |
          set -eo pipefail
          # The compose interpolates `../.env` (repo-root) as env_file for every
          # service; it's gitignored so a fresh checkout has none and
          # podman-compose refuses to start. Recreate it from the known values.
          [ -f .env ] || cat > .env <<'EOF'
          HYDRA_HEAD_RTX_NODE_CONFIG=node-rtx.yaml
          HYDRA_HEAD_RTX3060_NODE_CONFIG=node-rtx3060.yaml
          HYDRA_COORD_CONFIG_FILE=/etc/hydra/config/workers.json
          HYDRA_COORD_COMBINED_ENABLED=true
          HYDRA_COORD_MULTI_ENGINE_POLICY=combined
          HYDRA_COORD_MULTI_ENGINE_THRESHOLD=4096
          HYDRA_COORD_ALLOW_CROSS_MODEL_KV_REUSE=true
          EOF
          cd infra
          # --force-recreate: the core image was just rebuilt under the same
          # `localhost/hydra-core:latest` tag, so a plain `up` would leave the
          # previous container running the old image. Force a fresh container.
          podman compose -f docker-compose.hydra.yml up -d --force-recreate core
          echo "Hydra core started"

      - name: Deploy Hydra Head RTX
        run: |
          bash scripts/deploy-hydra-head.sh rtx

      - name: Verify services healthy
        run: |
          echo "Waiting for services to stabilise..."
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf http://localhost:9000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: coordinator status=$STATUS"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "Services OK"
              exit 0
            fi
            sleep 10
          done
          echo "Coordinator did not come up healthy after deploy"
          exit 1

      - name: Run LiveRig tests (Tier 2, optional)
        if: inputs.run-liverig == 'true'
        timeout-minutes: 180
        run: |
          set -eo pipefail
          dotnet build src/Hydra.sln -c Release --nologo -v minimal
          dotnet test src/core/Tests.LiveRig/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=liverig.trx" \
            --results-directory TestResults/
        env:
          COORD_URL: http://localhost:9000
          LLAMA_RTX_URL: http://localhost:8080
          LLAMA_P100_URL: http://192.168.122.21:8086
          COORD_METRICS_URL: http://localhost:9501/metrics
          STORE_HOST: 127.0.0.1
          STORE_PORT: "9500"

      - name: Write summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Hydra Core Deploy

          | Field | Value |
          |-------|-------|
          | Version | \`v${{ steps.version.outputs.version }}\` |
          | Commit | \`${{ steps.version.outputs.rev }}\` |
          | By | ${{ github.actor }} |
          | Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          **Coordinator**: http://localhost:9000/health
          **Head RTX**: http://localhost:9700/status
          EOF
