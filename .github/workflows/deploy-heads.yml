name: Deploy Heads (llama-engine)
run-name: Deploy Heads → ${{ inputs.gpu }}${{ inputs.run-tests != 'none' && format(' → {0} tests', inputs.run-tests) || '' }}

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU(s) to deploy"
        required: true
        type: choice
        options:
          - "all"
          - "rtx"
          - "rtx3060"
          - "p100"
          - "rtx+rtx3060"
      rtx-image:
        description: >
          Full OCI image ref for RTX nodes (blank = build from fork or use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-0.1.0-a157edf
        required: false
        default: ""
        type: string
      p100-image:
        description: >
          Full OCI image ref for P100 (blank = build from fork or use current).
          E.g. ghcr.io/ddvnguyen/llama-server:sm60-llama-server-0.1.0-a157edf
        required: false
        default: ""
        type: string
      build-from-fork:
        description: "Build llama-engine from fork before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run-tests:
        description: >
          Run tests after deploy, in order (both run serially on the live
          rig): system = LiveRig (Tier 2) + EngineParity (Tier 3);
          agent-workload = AgentWorkload (Tier 4).
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "system"
          - "agent-workload"
          - "both"
      system-test-filter:
        description: "Optional xUnit filter (FullyQualifiedName substring) passed to the System Tests workflow"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  checks: write

env:
  IMAGE_REPO: ghcr.io/ddvnguyen/llama-server

jobs:
  # ── Optional: build llama-engine via fork's workflow ───────────────────
  build-llama:
    name: Build llama-engine (fork)
    # Reusable workflow must be referenced at the JOB level (jobs.*.uses),
    # not inside a step. hydra-build.yml@hydra-fork declares workflow_call
    # with the inputs/outputs below. GITHUB_TOKEN is passed by default, so no
    # explicit secrets mapping is required for a cross-repo call.
    if: inputs.build-from-fork == 'true' && inputs.rtx-image == '' && inputs.p100-image == ''
    concurrency:
      group: deploy-heads-build
      cancel-in-progress: false
    uses: ddvnguyen/llama.cpp/.github/workflows/hydra-build.yml@hydra-fork
    with:
      build_llama_engine: true
      build_llama_server: false
      arch_sm86_sm120: ${{ inputs.gpu != 'p100' }}
      arch_sm60: ${{ inputs.gpu == 'all' || inputs.gpu == 'p100' }}
      runner_target: local
      execution_mode: matrix

  # ── Deploy to selected GPUs ───────────────────────────────────────────
  deploy:
    name: Deploy Heads → ${{ inputs.gpu }}
    runs-on: self-hosted
    needs: [build-llama]
    if: always() && (needs.build-llama.result == 'success' || needs.build-llama.result == 'skipped')
    timeout-minutes: 35
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HYDRA_HEAD_AUTH_TOKEN: ${{ secrets.HYDRA_HEAD_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select profile
        run: bash scripts/set-profile.sh moe

      - name: Determine images
        id: images
        run: |
          RTX="${{ inputs.rtx-image || needs.build-llama.outputs.rtx-image }}"
          P100="${{ inputs.p100-image || needs.build-llama.outputs.p100-image }}"
          echo "rtx=$RTX" >> "$GITHUB_OUTPUT"
          echo "p100=$P100" >> "$GITHUB_OUTPUT"
          echo "RTX image: ${RTX:-'(use current)'}"
          echo "P100 image: ${P100:-'(use current)'}"

      - name: Pin OCI images in node configs
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          pin_image() {
            local image="$1" config="$2"
            echo "Pinning $image in $config"
            sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*source:\s*\).*|\1${image}|" "$config"
            # Resolve the digest from the local store first (the image is often
            # already present), falling back to a pull. A failed resolution
            # keeps the config's existing image_digest — a pre-pinned digest
            # must survive — and must never hard-fail the step.
            local digest
            digest=$(podman inspect "$image" --format '{{.Digest}}' 2>/dev/null || \
                     (podman pull "$image" >/dev/null 2>&1 && podman inspect "$image" --format '{{.Digest}}' 2>/dev/null) || \
                     echo "")
            if [ -n "$digest" ]; then
              echo "Resolved digest: $digest"
              if grep -q 'image_digest:' "$config"; then
                sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*image_digest:\s*\).*|\1${digest}|" "$config"
              else
                sed -i "/^\s*source:\s*${image}$/a\\    image_digest: ${digest}" "$config"
              fi
            else
              echo "WARNING: Could not resolve digest for $image — keeping existing image_digest (if any)"
            fi
          }

          RTX_IMG="${{ steps.images.outputs.rtx }}"
          P100_IMG="${{ steps.images.outputs.p100 }}"
          if [ -n "$RTX_IMG" ]; then
            pin_image "$RTX_IMG" infra/hydra-head/config/node-rtx.yaml
            pin_image "$RTX_IMG" infra/hydra-head/config/node-rtx3060.yaml
          fi
          if [ -n "$P100_IMG" ]; then
            pin_image "$P100_IMG" infra/hydra-head/config/node-p100.yaml
          fi

      - name: Commit pinned images
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/hydra-head/config/
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin llama-engine OCI image (deploy-heads)"
            git push
          fi

      - name: Ensure SSH for P100
        if: inputs.gpu == 'all' || inputs.gpu == 'p100'
        run: |
          grep -q "Host hydra-p100" ~/.ssh/config 2>/dev/null || cat >> ~/.ssh/config <<'EOF'

          Host hydra-p100
              HostName 192.168.122.21
              User vm1
              IdentityFile ~/.ssh/vm_agent_01
              IdentitiesOnly yes
          EOF

      # scripts/deploy-hydra-head.sh handles `rtx+rtx3060` and `all` as
      # concurrent multi-head deploys internally (shared image build + core
      # brought up once, then each requested head deployed against its own
      # compose service in parallel — see run_concurrent in the script).
      # inputs.gpu's choices map 1:1 onto the script's target names.
      - name: Deploy heads
        run: bash scripts/deploy-hydra-head.sh "${{ inputs.gpu }}"

      # The script's own health-wait is a quick internal smoke-check (45s);
      # this is the authoritative gate (480s, rich failure diagnostics via
      # wait-for-head.sh). These are read-only status polls with no shared
      # state, so — same reasoning as the deploy step above — whichever
      # heads were actually deployed this run are waited on concurrently
      # rather than one after another.
      - name: Wait for deployed heads
        run: |
          set -uo pipefail
          pids=(); names=()
          start_wait() {
            bash scripts/ci/wait-for-head.sh "$1" "$2" 480 &
            pids+=("$!"); names+=("$1")
          }

          case "${{ inputs.gpu }}" in
            all)
              start_wait "hydra-head-rtx" "http://localhost:9700/status"
              start_wait "hydra-head-rtx3060" "http://localhost:9701/status"
              start_wait "hydra-head-p100" "http://192.168.122.21:9700/status"
              ;;
            rtx+rtx3060)
              start_wait "hydra-head-rtx" "http://localhost:9700/status"
              start_wait "hydra-head-rtx3060" "http://localhost:9701/status"
              ;;
            rtx)
              start_wait "hydra-head-rtx" "http://localhost:9700/status"
              ;;
            rtx3060)
              start_wait "hydra-head-rtx3060" "http://localhost:9701/status"
              ;;
            p100)
              start_wait "hydra-head-p100" "http://192.168.122.21:9700/status"
              ;;
          esac

          failed=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::${names[$i]} did not become healthy"; failed=1; }
          done
          [ "$failed" = "0" ] || exit 1

      # A missing pin is a hard failure, not a reason to skip. Guarding
      # these calls on `[ -n "$DIGEST" ]` would mean a broken extraction
      # or a removed image_digest silently turns this step green — the
      # same "wired up but never engages" failure this step exists to
      # catch (cf. #502, #477).  Only verify heads that were deployed
      # this run (gated on inputs.gpu).
      - name: Verify deployed digests
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          set -eo pipefail
          echo "Verifying deployed engine binaries..."

          # Extract pinned image_digest from node configs using anchored
          # sed within the llama-server: ... binary: range.
          extract_digest() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$config"
          }
          extract_source() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$config"
          }

          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)

          echo "RTX pinned: source=$RTX_SOURCE digest=$RTX_DIGEST"
          echo "P100 pinned: source=$P100_SOURCE digest=$P100_DIGEST"

          FAIL=0
          verify_head() {
            local label="$1" endpoint="$2" expected_digest="$3"
            local status_json
            status_json=$(curl -sf --max-time 10 "$endpoint" 2>/dev/null) || {
              echo "FAIL: $label ($endpoint) not responding"; FAIL=1; return
            }
            # Select the llama-server entry by name. Picking "the first entry
            # with a digest" would be a coin flip: Go map iteration is
            # randomised, so the JSON key order varies per request.
            local actual_digest
            actual_digest=$(echo "$status_json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          info = data.get('binaries', {}).get('llama-server') or {}
          print(info.get('pulled_digest', ''))
          " 2>/dev/null || echo "")

            if [ -z "$actual_digest" ]; then
              echo "FAIL: $label — no pulled_digest"; FAIL=1; return
            fi
            if [ "$expected_digest" = "$actual_digest" ]; then
              echo "OK: $label — digest matches: $actual_digest"
            else
              echo "FAIL: $label — digest mismatch (expected=$expected_digest actual=$actual_digest)"; FAIL=1
            fi
          }

          # Only verify heads that were actually deployed this run.
          # Verify RTX heads only if RTX was in the gpu selection and
          # a digest is pinned.  Same for P100.
          if [[ "${{ inputs.gpu }}" == all || "${{ inputs.gpu }}" == rtx || "${{ inputs.gpu }}" == "rtx+rtx3060" ]]; then
            if [ -z "$RTX_DIGEST" ]; then
              echo "FAIL: no image_digest pinned for RTX in node-rtx.yaml"; FAIL=1
            else
              verify_head "hydra-head-rtx" "http://localhost:9700/status" "$RTX_DIGEST"
              verify_head "hydra-head-rtx3060" "http://localhost:9701/status" "$RTX_DIGEST"
            fi
          fi

          if [[ "${{ inputs.gpu }}" == all || "${{ inputs.gpu }}" == p100 ]]; then
            if [ -z "$P100_DIGEST" ]; then
              echo "FAIL: no image_digest pinned for P100 in node-p100.yaml"; FAIL=1
            else
              verify_head "hydra-head-p100" "http://192.168.122.21:9700/status" "$P100_DIGEST"
            fi
          fi

          [ "$FAIL" -ne 0 ] && exit 1
          echo "All deployed heads verified — digests match pinned config"

      - name: Write summary
        if: always()
        run: |
          extract_source() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$1"
          }
          RTX_SRC=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SRC=$(extract_source infra/hydra-head/config/node-p100.yaml)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Heads Deploy — ${{ inputs.gpu }}

          | Field | Value |
          |-------|-------|
          | GPU | \`${{ inputs.gpu }}\` |
          | RTX image | \`${RTX_SRC}\` |
          | P100 image | \`${P100_SRC}\` |
          | By | ${{ github.actor }} |
          | Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          EOF

  # ── Optional: run test suites against the freshly deployed heads ──────
  # Triggered via the run-tests input. Each suite is its own reusable
  # workflow; the shared hydra-live-rig concurrency group serializes them
  # after the deploy job releases its slot.
  system-tests:
    name: System Tests (Tier 2 + 3)
    needs: deploy
    if: inputs.run-tests == 'system' || inputs.run-tests == 'both'
    uses: ./.github/workflows/test-system.yml
    with:
      filter: ${{ inputs.system-test-filter }}

  agent-workload-tests:
    name: Agent Workload Tests (Tier 4)
    needs: deploy
    if: inputs.run-tests == 'agent-workload' || inputs.run-tests == 'both'
    uses: ./.github/workflows/test-agent-workload.yml
