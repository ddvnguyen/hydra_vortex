name: Deploy Heads (llama-engine)
run-name: Deploy Heads → ${{ inputs.gpu }}${{ inputs.image-tag != 'current' && format(' [{0}]', inputs.image-tag) || '' }}${{ inputs.run-tests != 'none' && format(' → {0} tests', inputs.run-tests) || '' }}

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU(s) to deploy"
        required: true
        type: choice
        options:
          - "all"
          - "rtx"
          - "rtx3060"
          - "p100"
          - "rtx+rtx3060"
      runner:
        description: >
          Runner pool for the lightweight resolve jobs (resolve-pr and the
          fork's resolve/resolve-outputs). cloud = ubuntu-latest (default,
          use when GitHub-hosted runners are healthy); self-hosted =
          hydra-rtx-host (use during GitHub-hosted runner outages).
        required: false
        default: "cloud"
        type: choice
        options:
          - "cloud"
          - "self-hosted"
      image-tag:
        description: >
          llama-server OCI build to deploy to ALL selected GPUs. Per-arch
          refs are derived: RTX/3060 = sm86-sm120-llama-engine-<tag>, P100 =
          sm60-llama-server-<tag>. "current" = deploy the stable version
          pinned in the node configs (no re-pin). "latest" = newest build.
          Immutable tags are <fork-sha>[-pr<N>] (PR-built) or
          <version>-<fork-sha>. Refresh this list with
          scripts/ci/list-llama-image-tags.sh.
        required: false
        default: "current"
        type: choice
        options:
          - "current"
          - "latest"
          - "0.1.0-3bbac47"
          - "0.1.0-5b19995"
          - "0.1.0-6473fce"
          - "0.1.0-a9ce093-pr74"
          - "0.1.0-cfe8146"
          - "0.1.0-eb71174-pr74"
          - "22fff15"
          - "5b19995"
          - "a9ce093-pr74"
          - "eb71174-pr74"
      build-from-fork:
        description: "Build llama-engine + llama-server from fork before deploy (tags image with commit SHA and -pr<N> when built from a PR)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run-tests:
        description: >
          Run tests after deploy, in order (both run serially on the live
          rig): system = LiveRig (Tier 2) + EngineParity (Tier 3);
          agent-workload = AgentWorkload (Tier 4).
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "system"
          - "agent-workload"
          - "both"

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: read

env:
  IMAGE_REPO: ghcr.io/ddvnguyen/llama-server

jobs:
  # ── Resolve the PR id for the current branch (used to label fork builds) ──
  resolve-pr:
    name: Resolve PR id
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
    concurrency:
      group: deploy-heads-resolve-pr
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Detect PR id from head branch
        id: pr
        run: |
          PR=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Detected PR id: ${PR:-none}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Optional: build llama-engine + llama-server via fork's workflow ─────
  # Builds both RTX (engine) and P100 (server) images. The fork tags them
  # <arch>-<binary>-<version>-<sha>[-pr<N>]; the PR id is passed
  # programmatically (never a user input).
  build-llama:
    name: Build llama-engine + llama-server (fork)
    needs: [resolve-pr]
    # Reusable workflow must be referenced at the JOB level (jobs.*.uses),
    # not inside a step. hydra-build.yml@hydra-fork declares workflow_call
    # with the inputs/outputs below. GITHUB_TOKEN is passed by default, so no
    # explicit secrets mapping is required for a cross-repo call.
    if: inputs.build-from-fork == 'true' && inputs.image-tag == 'current'
    concurrency:
      group: deploy-heads-build
      cancel-in-progress: false
    uses: ddvnguyen/llama.cpp/.github/workflows/hydra-build.yml@hydra-fork
    with:
      build_llama_engine: true
      build_llama_server: true
      arch_sm86_sm120: ${{ inputs.gpu != 'p100' }}
      arch_sm60: ${{ inputs.gpu == 'all' || inputs.gpu == 'p100' }}
      runner_target: local
      execution_mode: matrix
      runner: ${{ inputs.runner }}
      pr: ${{ needs.resolve-pr.outputs.pr }}

  # ── Deploy to selected GPUs ───────────────────────────────────────────
  deploy:
    name: Deploy Heads → ${{ inputs.gpu }}
    runs-on: self-hosted
    needs: [build-llama]
    if: always() && (needs.build-llama.result == 'success' || needs.build-llama.result == 'skipped')
    timeout-minutes: 35
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      HYDRA_HEAD_AUTH_TOKEN: ${{ secrets.HYDRA_HEAD_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select profile
        run: bash scripts/set-profile.sh moe

      # The runner's static ghcr auth (auth.json) is not reliable — an
      # expired PAT or a GITHUB_TOKEN clobber from another run leaves
      # podman pull 403. The llama-server package is PUBLIC, so anonymous
      # pulls work and are never poisoned by a stale credential. Only
      # login when a GHCR_PAT is configured (read:packages — needed if the
      # package is ever made private again); NEVER login with the run's
      # GITHUB_TOKEN, which cannot read the fork-linked package and would
      # override the working anonymous access. (secrets cannot be used in
      # step `if:` — the empty-string check happens in the shell.)
      - name: Login to ghcr.io
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | podman login ghcr.io -u ddvnguyen --password-stdin
          else
            echo "ghcr auth: anonymous (package is public; no GHCR_PAT configured)"
          fi

      - name: Determine images
        id: images
        run: |
          RTX=""
          P100=""
          if [ "${{ inputs.build-from-fork }}" = "true" ]; then
            RTX="${{ needs.build-llama.outputs.rtx-image }}"
            P100="${{ needs.build-llama.outputs.p100-image }}"
          elif [ "${{ inputs.image-tag }}" != "current" ]; then
            RTX="ghcr.io/ddvnguyen/llama-server:sm86-sm120-llama-engine-${{ inputs.image-tag }}"
            P100="ghcr.io/ddvnguyen/llama-server:sm60-llama-server-${{ inputs.image-tag }}"
          fi
          echo "rtx=$RTX" >> "$GITHUB_OUTPUT"
          echo "p100=$P100" >> "$GITHUB_OUTPUT"
          echo "RTX image: ${RTX:-'(use current)'}"
          echo "P100 image: ${P100:-'(use current)'}"

      # Fail fast BEFORE touching the live rig: a missing/mutated image ref
      # (or a stale config pin, like the P100 crash-loop) is caught here with
      # a clear message instead of a crash-looping head.
      #
      # The llama-server package is PUBLIC: anonymous pulls are the reliable
      # path. Stale ghcr creds anywhere in podman's auth files (an expired
      # PAT, or a run-scoped GITHUB_TOKEN left by another job's login) make
      # podman send a token that ghcr DENIES — overriding the working
      # anonymous access with a 403. Strip ghcr.io from every auth file podman
      # could read, then pull anonymously. (GHCR_PAT, when configured, is
      # re-applied by the login step above AFTER these pulls run.)
      - name: Ensure anonymous ghcr access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, glob
          paths = set()
          for env in ("REGISTRY_AUTH_FILE", "XDG_RUNTIME_DIR"):
              v = os.environ.get(env, "")
              if v:
                  paths.add(v)
          for pat in (os.path.expanduser("~/.config/containers/auth.json"),
                      os.path.expanduser("~/.docker/config.json"),
                      f"/run/user/{os.getuid()}/containers/auth.json"):
              paths.add(pat)
          for p in sorted(paths):
              if not os.path.exists(p):
                  continue
              try:
                  d = json.load(open(p))
                  if d.get("auths", {}).pop("ghcr.io", None) is not None:
                      json.dump(d, open(p, "w"))
                      print(f"stripped ghcr.io from {p}")
                  elif "ghcr.io" not in str(d.get("auths", {})):
                      print(f"clean (no ghcr.io): {p}")
              except Exception as e:
                  print(f"skip {p}: {e}")
          PY

      - name: Validate image refs exist
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          set -euo pipefail
          validate_ref() {
            local ref="$1"
            if podman pull "$ref" >/dev/null 2>&1; then
              echo "OK: $ref"
            else
              echo "::error::Image ref not found or not pullable: $ref"
              echo "::error::Run scripts/ci/list-llama-image-tags.sh for the current valid image-tag list."
              exit 1
            fi
          }
          [ -n "${{ steps.images.outputs.rtx }}" ] && validate_ref "${{ steps.images.outputs.rtx }}"
          [ -n "${{ steps.images.outputs.p100 }}" ] && validate_ref "${{ steps.images.outputs.p100 }}"

      - name: Validate current pins in node configs
        if: steps.images.outputs.rtx == '' && steps.images.outputs.p100 == ''
        run: |
          set -euo pipefail
          check_pin() {
            local config="$1"
            local src digest actual
            src=$(sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$config")
            digest=$(sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$config")
            [ -n "$src" ] || { echo "::error::$config: no source pinned under llama-server:"; exit 1; }
            echo "Checking $config: $src"
            podman pull "$src" >/dev/null 2>&1 || { echo "::error::$config: $src not pullable"; exit 1; }
            if [ -n "$digest" ]; then
              actual=$(podman inspect "$src" --format '{{.Digest}}' 2>/dev/null || true)
              if [ "$actual" = "$digest" ]; then
                echo "OK: digest matches $actual"
              else
                echo "::error::$config: pinned digest mismatch (pinned=$digest actual=${actual:-none})"
                echo "::error::Re-run deploy with an explicit image-tag to re-pin, or fix $config."
                exit 1
              fi
            fi
          }
          check_pin infra/hydra-head/config/node-rtx.yaml
          check_pin infra/hydra-head/config/node-rtx3060.yaml
          check_pin infra/hydra-head/config/node-p100.yaml

      - name: Pin OCI images in node configs
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          pin_image() {
            local image="$1" config="$2"
            echo "Pinning $image in $config"
            sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*source:\s*\).*|\1${image}|" "$config"
            # Resolve the digest from the local store first (the image is often
            # already present), falling back to a pull. A failed resolution
            # keeps the config's existing image_digest — a pre-pinned digest
            # must survive — and must never hard-fail the step.
            local digest
            digest=$(podman inspect "$image" --format '{{.Digest}}' 2>/dev/null || \
                     (podman pull "$image" >/dev/null 2>&1 && podman inspect "$image" --format '{{.Digest}}' 2>/dev/null) || \
                     echo "")
            if [ -n "$digest" ]; then
              echo "Resolved digest: $digest"
              if grep -q 'image_digest:' "$config"; then
                sed -i "/^\s*llama-server:\s*$/,/^\s*binary:\s*/ s|^\(\s*image_digest:\s*\).*|\1${digest}|" "$config"
              else
                # Escape '/' in the image ref — it is interpolated into a
                # '/'-delimited sed address, and ghcr.io/… refs always
                # contain '/'. Without escaping, sed aborts with
                # "extra characters after command".
                local esc_image
                esc_image=$(printf '%s' "$image" | sed 's|/|\\/|g')
                sed -i "/^\s*source:\s*${esc_image}$/a\\    image_digest: ${digest}" "$config"
              fi
            else
              echo "WARNING: Could not resolve digest for $image — keeping existing image_digest (if any)"
            fi
          }

          RTX_IMG="${{ steps.images.outputs.rtx }}"
          P100_IMG="${{ steps.images.outputs.p100 }}"
          if [ -n "$RTX_IMG" ]; then
            pin_image "$RTX_IMG" infra/hydra-head/config/node-rtx.yaml
            pin_image "$RTX_IMG" infra/hydra-head/config/node-rtx3060.yaml
          fi
          if [ -n "$P100_IMG" ]; then
            pin_image "$P100_IMG" infra/hydra-head/config/node-p100.yaml
          fi

      - name: Commit pinned images (PR)
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/hydra-head/config/
          if ! git diff --cached --quiet; then
            BRANCH="deploy-heads/pin-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "chore: pin llama-engine OCI image (deploy-heads)"
            # Branch protection (GH006) rejects a direct push to main from
            # this job's GITHUB_TOKEN. Land the pin via a PR instead; the
            # deploy steps use the pinned config from this working tree
            # regardless, so a persistence failure must warn, not fail.
            if git push origin "$BRANCH"; then
              echo "Pushed pin branch $BRANCH."
              gh pr create --base main --head "$BRANCH" \
                --title "chore: pin llama-engine OCI image (deploy-heads)" \
                --body "Automatic image pin from deploy-heads (${{ github.actor }}). Deploy already applied this pin to the live rig; this PR persists it to main." \
                --label review-finding \
              || echo "::warning::gh pr create failed; the pin lives on branch $BRANCH — open a PR manually to persist it."
            else
              echo "::warning::Could not push pin branch $BRANCH. Deploy continues using the pinned config from this checkout; open a PR to persist the pin."
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure SSH for P100
        if: inputs.gpu == 'all' || inputs.gpu == 'p100'
        run: |
          grep -q "Host hydra-p100" ~/.ssh/config 2>/dev/null || cat >> ~/.ssh/config <<'EOF'

          Host hydra-p100
              HostName 192.168.122.21
              User vm1
              IdentityFile ~/.ssh/vm_agent_01
              IdentitiesOnly yes
          EOF

      # `core` + the shared `hydra-head:rtx` image must exist exactly once,
      # before either head's `compose up`, and before RTX/RTX3060 fan out
      # below — see deploy_shared_setup in the script for why.
      - name: Shared setup (build image, bring up core)
        if: inputs.gpu == 'all' || inputs.gpu == 'rtx' || inputs.gpu == 'rtx3060' || inputs.gpu == 'rtx+rtx3060'
        run: bash scripts/deploy-hydra-head.sh setup

      # True parallel steps (GH Actions `parallel:`, June 2026) — RTX,
      # RTX3060, and P100 each show as their own named step with its own
      # log, running concurrently, not three steps waiting on each other.
      # Safe because setup above already did the one-time shared work;
      # each `-only` target here touches nothing but its own compose
      # service (or, for P100, a wholly separate host over SSH). Deploy +
      # its authoritative health-wait (480s, rich diagnostics via
      # wait-for-head.sh — the script's own internal wait is just a quick
      # 45s smoke-check) stay together in one step per head: they're
      # inherently sequential for a given head anyway, so there's nothing
      # to gain from a second parallel group.
      - parallel:
          - name: Deploy RTX
            if: inputs.gpu == 'all' || inputs.gpu == 'rtx' || inputs.gpu == 'rtx+rtx3060'
            run: |
              bash scripts/deploy-hydra-head.sh rtx-only
              bash scripts/ci/wait-for-head.sh "hydra-head-rtx" "http://localhost:9700/status" 480

          - name: Deploy RTX 3060
            if: inputs.gpu == 'all' || inputs.gpu == 'rtx3060' || inputs.gpu == 'rtx+rtx3060'
            run: |
              bash scripts/deploy-hydra-head.sh rtx3060-only
              bash scripts/ci/wait-for-head.sh "hydra-head-rtx3060" "http://localhost:9701/status" 480

          - name: Deploy P100
            if: inputs.gpu == 'all' || inputs.gpu == 'p100'
            run: |
              bash scripts/deploy-hydra-head.sh p100
              bash scripts/ci/wait-for-head.sh "hydra-head-p100" "http://192.168.122.21:9700/status" 480

      # A missing pin is a hard failure, not a reason to skip. Guarding
      # these calls on `[ -n "$DIGEST" ]` would mean a broken extraction
      # or a removed image_digest silently turns this step green — the
      # same "wired up but never engages" failure this step exists to
      # catch (cf. #502, #477).  Only verify heads that were deployed
      # this run (gated on inputs.gpu).
      - name: Verify deployed digests
        if: steps.images.outputs.rtx != '' || steps.images.outputs.p100 != ''
        run: |
          set -eo pipefail
          echo "Verifying deployed engine binaries..."

          # Extract pinned image_digest from node configs using anchored
          # sed within the llama-server: ... binary: range.
          extract_digest() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*image_digest:/{ s/.*image_digest:[[:space:]]*//; p; } }' "$config"
          }
          extract_source() {
            local config="$1"
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$config"
          }

          RTX_DIGEST=$(extract_digest infra/hydra-head/config/node-rtx.yaml)
          P100_DIGEST=$(extract_digest infra/hydra-head/config/node-p100.yaml)
          RTX_SOURCE=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SOURCE=$(extract_source infra/hydra-head/config/node-p100.yaml)

          echo "RTX pinned: source=$RTX_SOURCE digest=$RTX_DIGEST"
          echo "P100 pinned: source=$P100_SOURCE digest=$P100_DIGEST"

          FAIL=0
          verify_head() {
            local label="$1" endpoint="$2" expected_digest="$3"
            local status_json
            status_json=$(curl -sf --max-time 10 "$endpoint" 2>/dev/null) || {
              echo "FAIL: $label ($endpoint) not responding"; FAIL=1; return
            }
            # Select the llama-server entry by name. Picking "the first entry
            # with a digest" would be a coin flip: Go map iteration is
            # randomised, so the JSON key order varies per request.
            local actual_digest
            actual_digest=$(echo "$status_json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          info = data.get('binaries', {}).get('llama-server') or {}
          print(info.get('pulled_digest', ''))
          " 2>/dev/null || echo "")

            if [ -z "$actual_digest" ]; then
              echo "FAIL: $label — no pulled_digest"; FAIL=1; return
            fi
            if [ "$expected_digest" = "$actual_digest" ]; then
              echo "OK: $label — digest matches: $actual_digest"
            else
              echo "FAIL: $label — digest mismatch (expected=$expected_digest actual=$actual_digest)"; FAIL=1
            fi
          }

          # Only verify heads that were actually deployed this run.
          # Verify RTX heads only if RTX was in the gpu selection and
          # a digest is pinned.  Same for P100.
          if [[ "${{ inputs.gpu }}" == all || "${{ inputs.gpu }}" == rtx || "${{ inputs.gpu }}" == "rtx+rtx3060" ]]; then
            if [ -z "$RTX_DIGEST" ]; then
              echo "FAIL: no image_digest pinned for RTX in node-rtx.yaml"; FAIL=1
            else
              verify_head "hydra-head-rtx" "http://localhost:9700/status" "$RTX_DIGEST"
              verify_head "hydra-head-rtx3060" "http://localhost:9701/status" "$RTX_DIGEST"
            fi
          fi

          if [[ "${{ inputs.gpu }}" == all || "${{ inputs.gpu }}" == p100 ]]; then
            if [ -z "$P100_DIGEST" ]; then
              echo "FAIL: no image_digest pinned for P100 in node-p100.yaml"; FAIL=1
            else
              verify_head "hydra-head-p100" "http://192.168.122.21:9700/status" "$P100_DIGEST"
            fi
          fi

          [ "$FAIL" -ne 0 ] && exit 1
          echo "All deployed heads verified — digests match pinned config"

      - name: Write summary
        if: always()
        run: |
          extract_source() {
            sed -n '/^[[:space:]]*llama-server:/,/^[[:space:]]*binary:/ { /^[[:space:]]*source:/{ s/.*source:[[:space:]]*//; p; } }' "$1"
          }
          RTX_SRC=$(extract_source infra/hydra-head/config/node-rtx.yaml)
          P100_SRC=$(extract_source infra/hydra-head/config/node-p100.yaml)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Heads Deploy — ${{ inputs.gpu }}

          | Field | Value |
          |-------|-------|
          | GPU | \`${{ inputs.gpu }}\` |
          | RTX image | \`${RTX_SRC}\` |
          | P100 image | \`${P100_SRC}\` |
          | By | ${{ github.actor }} |
          | Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          EOF

  # ── Optional: run test suites against the freshly deployed heads ──────
  # Triggered via the run-tests input. Each suite is its own reusable
  # workflow; the shared hydra-live-rig concurrency group serializes them
  # after the deploy job releases its slot.
  #
  # NB: job-level `if:` cannot read the caller's `inputs` context on a
  # `uses:` job (the skipped-System-Tests bug: run-tests=system was passed
  # but the job still skipped). Gate INSIDE the reusable workflow instead —
  # pass run-tests via `with:` and let the called workflow decide.
  system-tests:
    name: System Tests (Tier 2 + 3)
    needs: deploy
    uses: ./.github/workflows/test-system.yml
    with:
      run-tests: ${{ github.event.inputs.run-tests || inputs.run-tests || 'none' }}

  agent-workload-tests:
    name: Agent Workload Tests (Tier 4)
    needs: deploy
    uses: ./.github/workflows/test-agent-workload.yml
    with:
      run-tests: ${{ github.event.inputs.run-tests || inputs.run-tests || 'none' }}
