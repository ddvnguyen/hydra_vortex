name: Agent Workload Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  agent-workload:
    name: Agent Workload Tests (Tier 4)
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Restore & build (.NET)
        run: dotnet build src/Hydra.sln -c Release --nologo -v minimal

      - name: Verify coordinator healthy
        run: |
          STATUS=$(curl -sf http://localhost:9000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unreachable")
          if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "degraded" ]; then
            echo "Coordinator not healthy (status=$STATUS). Deploy services first."
            exit 1
          fi
          echo "Coordinator: $STATUS"

      - name: Run agent workload tests (Tier 4)
        run: |
          dotnet test src/core/Tests.AgentWorkload/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=agentworkload.trx" \
            --results-directory TestResults/
        env:
          COORD_URL: http://localhost:9000
          RTX_LLAMA_URL: http://localhost:8080
          P100_LLAMA_URL: http://192.168.122.21:8086
          LLAMA_RTX_URL: http://localhost:8080
          LLAMA_P100_URL: http://192.168.122.21:8086
          RTX_AGENT_HOST: "127.0.0.1"
          RTX_AGENT_PORT: "9601"
          P100_AGENT_HOST: "192.168.122.21"
          P100_AGENT_PORT: "9602"
          STORE_HOST: "127.0.0.1"
          STORE_PORT: "9500"

      - name: Publish results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Agent Workload Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-workload-results-${{ github.run_number }}
          path: TestResults/*.trx
          retention-days: 30
