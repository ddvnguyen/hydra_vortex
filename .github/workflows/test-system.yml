name: System Tests

on:
  workflow_call:
    inputs:
      run-tests:
        description: "run-tests dispatch value (none|system|agent-workload|both); the job runs only when this includes 'system' or 'both'"
        required: false
        default: "none"
        type: string
      filter:
        description: "xUnit filter expression — FullyQualifiedName substring match (blank = all live-rig + engine-parity tests)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      run-tests:
        description: "run-tests dispatch value (none|system|agent-workload|both); the job runs only when this includes 'system' or 'both'"
        required: false
        default: "system"
        type: choice
        options:
          - "none"
          - "system"
          - "agent-workload"
          - "both"
      filter:
        description: "xUnit filter expression — FullyQualifiedName substring match (blank = all live-rig + engine-parity tests)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  checks: write

jobs:
  system:
    name: System Tests
    runs-on: self-hosted
    timeout-minutes: 30
    if: ${{ inputs.run-tests == 'system' || inputs.run-tests == 'both' }}
    concurrency:
      group: hydra-live-rig
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Restore & build (.NET)
        run: dotnet build src/Hydra.sln -c Release --nologo -v minimal

      - name: Verify coordinator healthy
        run: |
          STATUS=$(curl -sf http://localhost:9000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unreachable")
          if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "degraded" ]; then
            echo "Coordinator not healthy (status=$STATUS). Deploy services first."
            exit 1
          fi
          echo "Coordinator: $STATUS"

      - name: Run live-rig tests (Tier 2)
        run: |
          dotnet test src/core/Tests.LiveRig/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=liverig.trx" \
            --results-directory TestResults/ \
            ${{ inputs.filter && format('--filter "FullyQualifiedName~{0}"', inputs.filter) || '' }}
        env:
          COORD_URL: http://localhost:9000
          RTX_LLAMA_URL: http://localhost:8080
          P100_LLAMA_URL: http://192.168.122.21:8086
          LLAMA_RTX_URL: http://localhost:8080
          LLAMA_P100_URL: http://192.168.122.21:8086
          RTX_AGENT_HOST: "127.0.0.1"
          RTX_AGENT_PORT: "9601"
          P100_AGENT_HOST: "192.168.122.21"
          P100_AGENT_PORT: "9602"
          STORE_HOST: "127.0.0.1"
          STORE_PORT: "9500"

      - name: Run engine-parity tests (Tier 3)
        run: |
          dotnet test src/core/Tests.EngineParity/ -c Release --no-build --nologo -v normal \
            --settings src/Hydra.runsettings \
            --logger "trx;LogFileName=engineparity.trx" \
            --results-directory TestResults/
        env:
          COORD_URL: http://localhost:9000
          RTX_LLAMA_URL: http://localhost:8080
          P100_LLAMA_URL: http://192.168.122.21:8086
          LLAMA_RTX_URL: http://localhost:8080
          LLAMA_P100_URL: http://192.168.122.21:8086
          RTX_AGENT_HOST: "127.0.0.1"
          RTX_AGENT_PORT: "9601"
          P100_AGENT_HOST: "192.168.122.21"
          P100_AGENT_PORT: "9602"
          STORE_HOST: "127.0.0.1"
          STORE_PORT: "9500"

      - name: Publish results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: System Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-results-${{ github.run_number }}
          path: TestResults/*.trx
          retention-days: 30
